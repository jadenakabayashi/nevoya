<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanes · Create a Lane — Apollo by Nevoya</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#00786F;--teal-soft:#DCEFE9;--ink:#0F172A;--gray:#64748B;--line:#E2E8F0;--bg:#F7F7F8;
--yellow:#F5E077;--purple:#E4DDF7;--red:#DC2626;--redsoft:#FDECEC;--orange:#E67E22;--green:#27AE60;--greensoft:#E7F6EC;--warnbg:#FCF6DE;--blue:#1D4ED8;--bluesoft:#E0EAFB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,-apple-system,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;font-size:14px}
#app{display:flex;height:100vh}
/* rail (matches mvp2-apollo.html) */
#rail{width:64px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex:none}
#rail .logo{width:34px;height:34px;border-radius:8px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-bottom:10px}
#rail .ric{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#475569;position:relative}
#rail .ric:hover{background:#F1F5F9}
#rail .ric.active{background:var(--teal-soft);color:var(--teal)}
#rail .ric.ghost{opacity:.38;cursor:default}
#rail .tz{margin-top:auto;font-size:11px;color:var(--gray);font-weight:500}
#rail .tip{position:absolute;left:52px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;display:none;z-index:50}
#rail .ric:hover .tip{display:block}
/* main */
#maincol{flex:1;display:flex;flex-direction:column;min-width:0}
#lanehead{padding:18px 26px 0}
#lanehead .top{display:flex;align-items:center;gap:14px}
#lanehead h1{font-size:26px;font-weight:500}
#lanehead .sub{color:var(--gray);font-size:12.5px;margin-top:4px}
.abtn{border:1px solid #CBD5E1;background:#fff;border-radius:7px;font-size:13px;font-weight:500;padding:7px 13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.abtn:hover{background:#F8FAFC}
.abtn.primary{background:var(--teal);border-color:var(--teal);color:#F7F7F8}
.abtn.primary:hover{background:#16403E}
.abtn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;align-items:center;gap:8px;padding:14px 26px 4px;flex-wrap:wrap}
.chip{border:1px solid #CBD5E1;border-radius:16px;padding:4px 13px;font-size:12.5px;cursor:pointer;background:#fff;color:#334155}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.gtoggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#334155;margin-left:auto;cursor:pointer;user-select:none;white-space:nowrap}
.switch{position:relative;width:40px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:#99A1AF;border-radius:8px;transition:background .15s ease;cursor:pointer}
.switch .thumb{position:absolute;top:2px;left:2px;width:22px;height:16px;background:#fff;border-radius:6px;transition:transform .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
.switch input:checked+.track{background:var(--teal)}
.switch input:checked+.track .thumb{transform:translateX(14px)}
#listwrap{flex:1;overflow:auto;padding:10px 26px 90px}
.listcard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* Load type column temporarily removed (was 1.15fr before the trailing chev track in both rules below) — restore by adding it back in .colhead/.lanerow and .colhead.grouped/.lanerow.grouped */
.colhead{display:grid;grid-template-columns:1.1fr .7fr 1fr 1.8fr 1.3fr .9fr 20px;gap:18px;padding:10px 16px;font-size:11px;letter-spacing:.4px;color:var(--gray);font-weight:500;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0}
.colhead.grouped,.lanerow.grouped{grid-template-columns:1.1fr .7fr 1.8fr 1.3fr .9fr 20px}
.grouphead{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:13px;font-weight:500;color:#334155;background:#FAFBFB;border-bottom:1px solid var(--line);border-top:1px solid var(--line);cursor:pointer}
.grouphead .chev{transition:transform .15s;color:var(--gray);display:inline-block}
.grouphead.collapsed .chev{transform:rotate(-90deg)}
.grouphead .n{color:var(--gray);font-weight:400}
.lanerow{display:grid;grid-template-columns:1.1fr .7fr 1fr 1.8fr 1.3fr .9fr 20px;gap:18px;align-items:center;padding:12px 16px;border-bottom:1px solid #F1F5F9;cursor:pointer;font-size:13.5px}
.lanerow:hover{background:#F8FAFC}
.lanerow .code{font-weight:500;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.lanerow .codeline{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanerow .renline{font-size:10.5px;font-weight:400;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flagexp{background:var(--warnbg);color:#92400E;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:10px;white-space:nowrap;flex:none}
.lanerow .cust{color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanerow .od{color:#334155;overflow:hidden}
.lanerow .od .odcell{display:flex;align-items:center;gap:5px;min-width:0}
.lanerow .od .odfirst{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lanerow .od .odmore{flex:none;color:var(--gray);font-size:11px;font-weight:500;white-space:nowrap;text-decoration:underline;cursor:default}
.lanerow .win{color:var(--gray);font-size:12.5px;white-space:nowrap}
.lanerow .pd{color:var(--gray);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanerow .lt{color:var(--gray);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanerow .chev2{color:#CBD5E1}
.pill{border-radius:12px;padding:3px 11px;font-size:12px;font-weight:500;display:inline-block}
.p-scheduled{background:var(--bluesoft);color:var(--blue)}
.p-active{background:var(--greensoft);color:#166534}
.p-expired{background:var(--warnbg);color:#92400E}
.p-cancelled{background:#E5E7EB;color:#374151}
.lid{background:#F1F5F9;border-radius:6px;padding:3px 9px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
/* drawer */
#drawer{width:0;flex:none;background:#fff;border-left:1px solid var(--line);overflow:hidden;transition:width .18s ease;display:flex;flex-direction:column}
#drawer.open{width:560px}
#dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:none}
#dhead .top{display:flex;align-items:center;gap:8px}
#dhead .x{margin-left:auto;cursor:pointer;color:var(--gray);font-size:16px;padding:2px 8px;border-radius:6px}
#dhead .x:hover{background:#F1F5F9}
#dhead h2{font-size:17px;font-weight:500;margin-top:6px}
#dhead .meta{color:var(--gray);font-size:12.5px;margin-top:3px}
#dhead .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#dtl{flex:1;overflow-y:auto;padding:14px 18px 24px}
#dtl .sect{font-size:11px;letter-spacing:1px;color:var(--gray);font-weight:500;margin-bottom:10px;display:flex}
#dtl .sect span:last-child{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:6px}
.dr{display:flex;flex-direction:column;gap:2px;font-size:13px}
.dr .k{font-size:11px;color:var(--gray);letter-spacing:.3px}
.dr .v{color:var(--ink)}
.odview{padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13.5px;background:#FBFDFC}
.odview i{color:#94A3B8;font-style:normal;font-size:12px}
.provbanner{background:#F6F8FB;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#334155;line-height:1.5}
.provlink{color:var(--teal);cursor:pointer;font-weight:500}
.provlink:hover{text-decoration:underline}
.mrow{display:grid;grid-template-columns:64px 96px 84px 1fr 64px 64px;gap:8px;padding:7px 0;border-bottom:1px solid #F1F5F9;font-size:12.5px;align-items:center}
.mrow.head{color:var(--gray);font-size:10.5px;letter-spacing:.4px;font-weight:500;border-bottom:1px solid var(--line)}
.mrow .note{grid-column:1/-1;color:var(--orange);font-size:11.5px;padding:2px 0 4px}
.mrow .late{color:var(--red);font-weight:500}
.mweekhead{padding:10px 0 4px;font-size:11.5px;font-weight:500;color:#334155}
.mweekhead .n{color:var(--gray);font-weight:400;margin-left:6px}
.tlwrap{margin-bottom:14px}
.tlrow{display:grid;grid-template-columns:1.3fr 1.7fr 0.9fr 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #F1F5F9;font-size:12.5px;align-items:center}
.tlrow.head{color:var(--gray);font-size:10.5px;letter-spacing:.4px;font-weight:500;border-bottom:1px solid var(--line)}
.tlrow.current{background:var(--teal-soft)}
.tlnow{color:var(--teal);font-weight:500;font-size:11px}
/* form */
.hint{font-size:10px;line-height:12px;font-weight:500;letter-spacing:.3px;color:#45556C}
.err{color:var(--red);font-size:11.5px;min-height:14px}
.conflictbanner{background:var(--warnbg);border:1px solid #E8C34A;border-radius:9px;padding:12px 14px}
.conflictbanner .t{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px}
.conflictbanner .d{font-size:12.5px;color:#7C5A00;margin-top:5px;line-height:1.5}
.conflictbanner .btns{margin-top:9px}

/* ---- Figma Dialog component (Lanes — Edit lane / Cancel lane / Remove OD pair, node 15119:7583 etc.) ---- */
.dlg{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.dlg .dhd{padding:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex:none}
.dlg .dhd .tw{display:flex;flex-direction:column;gap:4px;min-width:0}
.dlg .dhd .ttl{font-size:20px;line-height:28px;font-weight:600;color:#0F172B}
.dlg .dhd .sub{font-size:14px;line-height:20px;font-weight:500;color:#45556C}
.dlg .dhd .x{cursor:pointer;color:#45556C;min-width:32px;min-height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.dlg .dhd .x:hover{background:#F6F8FB}
.dlg .dbd{padding:12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.dlg .dft{padding:12px;display:flex;gap:8px;flex:none}
.dlg .dft .grp{flex:1;display:flex;gap:16px;justify-content:flex-end}
#ovl{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:100}
#ovl.show{display:flex}
#ovl .dlg{width:444px;max-width:92vw;max-height:88vh}
#formOvl{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:90}
#formOvl.show{display:flex}
#formOvl .dlg{width:600px;max-width:92vw;max-height:88vh}

/* Button (Button/16, node 71:95) */
.fbtn{border-radius:10px;padding:10px 16px;font-size:16px;line-height:20px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.fbtn.primary{background:var(--teal);color:#fff;border:none}
.fbtn.primary:hover{opacity:.9}
.fbtn.disruptive{background:#E7000B;color:#fff;border:none}
.fbtn.disruptive:hover{opacity:.9}
.fbtn.outline{background:#fff;color:#1D293D;border:1px solid #CAD5E2}
.fbtn.outline:hover{background:#F6F8FB}
.fbtn.full{width:100%}

/* Text input (node 54:68) */
.ti{display:flex;flex-direction:column;gap:2px;width:100%}
.ti.disabled{opacity:.5}
.ti .row{background:#E6EFFA;border-radius:10px;min-height:40px;display:flex;align-items:center;gap:8px;padding:4px 10px}
.ti .txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ti label{font-size:12px;line-height:14px;font-weight:500;letter-spacing:.1px;color:#314158}
.ti select,.ti input{border:none;background:transparent;outline:none;font-size:14px;line-height:18px;font-weight:500;color:#1D293D;padding:0;width:100%;font-family:inherit;min-width:0}
.ti select{appearance:none;-webkit-appearance:none;cursor:pointer}
.ti input[type=date]::-webkit-calendar-picker-indicator{display:none}

/* custom calendar popover (matches app tokens instead of the native OS picker) */
.datepop{position:fixed;display:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.16);padding:10px;width:224px;z-index:200}
.datepop.show{display:block}
.dphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dpmonth{font-size:13px;font-weight:600;color:#0F172B}
.dpnav{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;color:#45556C;flex:none}
.dpnav:hover{background:#F6F8FB}
.dpdow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;font-weight:600;color:var(--gray);margin-bottom:2px}
.dpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dpday{height:28px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#1D293D;border-radius:8px;cursor:pointer}
.dpday:hover{background:#F6F8FB}
.dpday.muted{color:#CAD5E2;cursor:default}
.dpday.muted:hover{background:none}
.dpday.today{font-weight:600;color:var(--teal)}
.dpday.sel{background:var(--teal);color:#fff;font-weight:600}
.ti .icon{flex:none;color:#1D293D;width:20px;height:20px}
.trow2{display:flex;gap:8px;width:100%;align-items:flex-start}
.trow2>.ti{flex:1;min-width:0}

/* OD pair row + Icon button (trash, node 81:663) */
.odrow{display:flex;flex-direction:column;gap:4px;width:100%}
.odrow .trow2{align-items:center}
.trashbtn{border:1px solid #CAD5E2;background:#fff;border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#1D293D}
.trashbtn:hover{background:#F6F8FB}

/* Checkbox (node 53:112) */
.cb2{display:flex;align-items:center;gap:8px;height:32px;cursor:pointer}
.cb2 input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid #CAD5E2;border-radius:6px;background:#fff;cursor:pointer;flex:none;position:relative;margin:0}
.cb2 input:checked{background:var(--teal);border-color:var(--teal)}
.cb2 input:checked::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb2 span{font-size:14px;line-height:20px;font-weight:500;color:#314158}
.cb2 input:checked+span{font-weight:600;color:var(--teal)}

/* dialog body section titles (Title/Medium 16px) */
.fsect{display:flex;flex-direction:column;gap:10px;width:100%}
.fsect>.ttl2{font-size:16px;line-height:20px;font-weight:600;color:#0F172B}
.fgroup{display:flex;flex-direction:column;gap:16px;width:100%}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;border-radius:8px;padding:9px 16px;font-size:13.5px;z-index:300;max-width:80vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="rail">
    <div class="logo">N</div>
    <div class="ric" onclick="location.href='../mvp2-apollo.html'">📦<span class="tip">Loads</span></div>
    <div class="ric active">🛣<span class="tip">Lanes</span></div>
    <div class="ric ghost">✦<span class="tip">Ask Apollo — coming to Lanes</span></div>
    <div class="ric ghost">🔔<span class="tip">Alerts feed — coming soon</span></div>
    <div class="ric ghost">🗓</div><div class="ric ghost">🚛</div><div class="ric ghost">👤</div><div class="ric ghost">📊</div>
    <div class="tz">TX·CA</div>
  </div>
  <div id="maincol">
    <div id="lanehead">
      <div class="top">
        <div>
          <h1>Lanes</h1>
          <div class="sub" id="lanesub">— lanes</div>
        </div>
        <button class="abtn primary" style="margin-left:auto" onclick="openCreateModal()">＋ Create lane</button>
      </div>
    </div>
    <div class="toolbar">
      <div id="lanechips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <label class="gtoggle"><span class="switch"><input type="checkbox" id="groupToggle" checked><span class="track"><span class="thumb"></span></span></span>Group by customer</label>
    </div>
    <div id="listwrap"></div>
  </div>
  <div id="drawer">
    <div id="dhead"></div>
    <div id="dtl"></div>
  </div>
</div>

<div id="formOvl"><div class="dlg" id="formModalBox"></div></div>
<div id="ovl"><div class="dlg" id="modalbox"></div></div>
<div id="datepop" class="datepop"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
const ICON_X='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
const ICON_CHEVRON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_CALENDAR='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const ICON_TRASH='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>';
const ICON_PLUS='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_CHEV_L='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ICON_CHEV_R='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
function dlgHead(title,subtitle,closeId){
 return '<div class="dhd"><div class="tw"><div class="ttl">'+title+'</div>'+(subtitle?'<div class="sub">'+subtitle+'</div>':'')+'</div><span class="x" id="'+(closeId||'dlgx')+'">'+ICON_X+'</span></div>';
}
function dlgFoot(buttonsHtml){
 return '<div class="dft"><div class="grp">'+buttonsHtml+'</div></div>';
}
/* ---------- custom calendar popover (on-brand replacement for the native date picker) ---------- */
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_LABELS=['S','M','T','W','T','F','S'];
let DPOP_TARGET=null,CAL_VIEW=null;
function pad2(n){return String(n).padStart(2,'0');}
function ymd(y,m,d){return y+'-'+pad2(m+1)+'-'+pad2(d);}
function closeDatePicker(){$('datepop').classList.remove('show');DPOP_TARGET=null;CAL_VIEW=null;}
function openDatePicker(el){
 const input=el.closest('.row').querySelector('input[type=date]');
 if(!input||input.disabled)return;
 DPOP_TARGET=input;
 const base=input.value||TODAY;
 const d=new Date(base+'T00:00:00');
 renderCalendarPopover(d.getFullYear(),d.getMonth(),el);
}
function calNav(dir){let m=CAL_VIEW.m+dir,y=CAL_VIEW.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}renderCalendarPopover(y,m,CAL_VIEW.anchorEl);}
function pickDate(val){if(DPOP_TARGET){DPOP_TARGET.value=val;DPOP_TARGET.dispatchEvent(new Event('change',{bubbles:true}));}closeDatePicker();}
function renderCalendarPopover(y,m,anchorEl){
 CAL_VIEW={y,m,anchorEl};
 const pop=$('datepop');
 const selVal=DPOP_TARGET.value;
 const firstDow=new Date(y,m,1).getDay();
 const daysInMonth=new Date(y,m+1,0).getDate();
 const daysInPrevMonth=new Date(y,m,0).getDate();
 let cells='';
 for(let i=0;i<firstDow;i++){cells+='<div class="dpday muted">'+(daysInPrevMonth-firstDow+1+i)+'</div>';}
 for(let d=1;d<=daysInMonth;d++){
  const val=ymd(y,m,d);

/* ---------- helpers ---------- */
function fmtDate(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDateShort(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function windowText(l){return (fmtDate(l.plannedStart)||'—')+' – '+(fmtDate(l.plannedEnd)||'—');}
function mondayOf(iso){const d=new Date(iso+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function weekLabel(mondayIso){return fmtDateShort(mondayIso)+' – '+fmtDateShort(addDays(mondayIso,6));}
function last4WeeksStart(){return addDays(mondayOf(TODAY),-21);}
function recentMatched(matched){const windowStart=last4WeeksStart();return matched.filter(m=>m.date&&m.date>=windowStart&&m.date<=TODAY);}
function groupMatchedByWeek(matched){
 const recent=recentMatched(matched);
 const groups={};
 recent.forEach(m=>{const wk=mondayOf(m.date);(groups[wk]=groups[wk]||[]).push(m);});
 Object.values(groups).forEach(g=>g.sort((a,b)=>a.date.localeCompare(b.date)));
 const weeks=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
 return{recent,weeks,groups};
}
function odLabel(pair){const o=pair.origin||'any origin';const d=pair.destination||'any destination';return o+' → '+d;}
function odSummary(l){
 if(!l.od.length)return '—';
 return '<span class="odcell" data-lane="'+esc(l.id)+'"><span class="odfirst"></span><span class="odmore"></span></span>';
}
function layoutOdCells(){
 document.querySelectorAll('.odcell[data-lane]').forEach(cell=>{
  const l=LANES[cell.dataset.lane];
  if(!l)return;
  const first=cell.querySelector('.odfirst');
  const more=cell.querySelector('.odmore');
  const labels=l.od.map(odLabel);
  const render=n=>{
   first.textContent=labels.slice(0,n).join('  ·  ');
   const remaining=labels.length-n;
   more.textContent=remaining>0?'+'+remaining+' more':'';
   more.style.display=remaining>0?'inline':'none';
   cell.title=remaining>0?labels.join('\n'):'';
  };
  let shown=labels.length;
  render(shown);
  while(shown>1&&first.scrollWidth>first.clientWidth){shown--;render(shown);}
 });
}
function locMatch(a,b){return !a||!b||a.toLowerCase()===b.toLowerCase();}
function odOverlap(a,b){return locMatch(a.origin,b.origin)&&locMatch(a.destination,b.destination);}
function dateOverlap(s1,e1,s2,e2){const E1=e1||'9999-12-31',E2=e2||'9999-12-31';return s1<=E2&&s2<=E1;}
function findConflict(customer,od,start,end,excludeIds){excludeIds=excludeIds||[];
 for(const id in LANES){const L=LANES[id];
  if(excludeIds.includes(id))continue;
  if(L.customer!==customer)continue;
  const st=deriveStatus(L);
  if(st==='Cancelled'||st==='Expired')continue;
  if(!dateOverlap(start,end,L.plannedStart,L.plannedEnd))continue;
  for(const p of od)for(const lp of L.od)if(odOverlap(p,lp))return{lane:L,pair:p,lp:lp};
 }
 return null;}
function idFromCode(code){let base=(code||'LANE').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'LANE';let id=base,n=1;while(LANES[id]){n++;id=base+'-'+n;}return id;}
function autoCode(customer){return (customer||'LANE').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()+'-'+Math.floor(Math.random()*900+100);}
function rootLane(l){let cur=l;while(cur.renewedFrom&&LANES[cur.renewedFrom])cur=LANES[cur.renewedFrom];return cur;}
function suggestRenewCode(l){return rootLane(l).code+'-'+(l.version+1);}
function deriveStatus(l){
 if(l.actualEnd)return 'Cancelled';
 if(!l.actualStart)return 'Scheduled';
 if(l.plannedEnd&&TODAY>l.plannedEnd)return 'Expired';
 return 'Active';
}
function renewedToLane(id){return Object.values(LANES).find(x=>x.renewedFrom===id)||null;}
function provVerb(endedLane){return(endedLane&&endedLane.cancelReason==='Renegotiation')?'Renegotiated':'Renewed';}
function chainOf(l){
 let root=l;
 while(root.renewedFrom&&LANES[root.renewedFrom])root=LANES[root.renewedFrom];
 const chain=[root];
 let cur=root;
 while(true){const next=renewedToLane(cur.id);if(!next)break;chain.push(next);cur=next;}
 return chain;
}
function isExpiringSoon(l){if(deriveStatus(l)!=='Active'||!l.plannedEnd||renewedToLane(l.id))return false;const days=(new Date(l.plannedEnd)-new Date(TODAY))/86400000;return days>=0&&days<=21;}

/* ---------- list ---------- */
let GROUPBY=true,COLLAPSED={},CHIPFILTER='all',SELECTED=null;
function chipCounts(){const vals=Object.values(LANES).filter(l=>!renewedToLane(l.id));
 return{all:vals.length,scheduled:vals.filter(l=>deriveStatus(l)==='Scheduled').length,active:vals.filter(l=>deriveStatus(l)==='Active').length,expired:vals.filter(l=>deriveStatus(l)==='Expired').length,cancelled:vals.filter(l=>deriveStatus(l)==='Cancelled').length,exp:vals.filter(isExpiringSoon).length};}
function renderChips(){const c=chipCounts();
 const defs=[['all','All lanes',c.all],['scheduled','Scheduled',c.scheduled],['active','Active',c.active],['exp','Expiring soon',c.exp],['expired','Expired',c.expired],['cancelled','Cancelled',c.cancelled]];
 $('lanechips').innerHTML=defs.map(d=>'<div class="chip'+(CHIPFILTER===d[0]?' on':'')+'" onclick="CHIPFILTER=\''+d[0]+'\';renderList()">'+d[1]+' '+d[2]+'</div>').join('');}
function passFilter(l){if(CHIPFILTER==='all')return true;if(CHIPFILTER==='exp')return isExpiringSoon(l);return deriveStatus(l)===CHIPFILTER[0].toUpperCase()+CHIPFILTER.slice(1);}
function statusPill(l){const st=deriveStatus(l);const cls='p-'+st.toLowerCase();return '<span class="pill '+cls+'">'+st+'</span>';}
function pickupDropLabel(l){if(l.dropPickup&&l.dropDelivery)return 'Pick-up & Delivery';if(l.dropPickup)return 'Pick-up';if(l.dropDelivery)return 'Delivery';return '—';}
function rowHTML(id,showCust){const l=LANES[id];
 const parent=l.renewedFrom?LANES[l.renewedFrom]:null;
 const verb=parent?provVerb(parent):null;
 const cue=parent?'<div class="renline">'+(verb==='Renegotiated'?'⇄':'↻')+' '+verb+' from '+esc(parent.code)+' · since '+fmtDate(l.actualStart||l.plannedStart)+'</div>':'';
 return '<div class="lanerow'+(showCust?'':' grouped')+'" onclick="openLaneDrawer(\''+id+'\')">'+
 '<div class="code"><div class="codeline">'+esc(l.code)+(isExpiringSoon(l)?'<span class="flagexp" title="Planned end within 3 weeks — no renewal yet">Expiring soon</span>':'')+'</div>'+cue+'</div>'+
 '<div>'+statusPill(l)+'</div>'+
 (showCust?'<div class="cust">'+esc(l.customer)+'</div>':'')+
 '<div class="od">'+odSummary(l)+'</div>'+
 '<div class="win">'+windowText(l)+'</div>'+
 // '<div class="lt">'+(l.loadType||'—')+'</div>'+  // Load type column temporarily removed — restore this line (and the header below, and the CSS grid tracks) to bring it back
 '<div class="pd">'+pickupDropLabel(l)+'</div>'+
 '<div class="chev2">›</div></div>';}
function colHead(showCust){return '<div class="colhead'+(showCust?'':' grouped')+'"><div>Lane</div><div>Status</div>'+(showCust?'<div>Customer</div>':'')+'<div>OD pair(s)</div><div>Planned window</div>'+/* '<div>Load type</div>'+ */'<div>Pick-up/Delivery</div><div></div></div>';}
function toggleGroup(c){COLLAPSED[c]=!COLLAPSED[c];renderList();}
function updateSub(){const c=chipCounts();$('lanesub').textContent=c.all+' lanes · '+c.active+' active · '+c.exp+' expiring soon';}
function renderList(){renderChips();updateSub();
 const ids=Object.keys(LANES).filter(id=>!renewedToLane(id)).filter(id=>passFilter(LANES[id]));
 const wrap=$('listwrap');
 if(!ids.length){wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray);font-size:13.5px">No lanes match this filter.</div>';return;}
 if(GROUPBY){
  const byCust={};ids.forEach(id=>{const c=LANES[id].customer;(byCust[c]=byCust[c]||[]).push(id);});
  const custs=Object.keys(byCust).sort();
  wrap.innerHTML='<div class="listcard">'+colHead(false)+custs.map(c=>{
   const collapsed=!!COLLAPSED[c];
   return '<div class="grouphead'+(collapsed?' collapsed':'')+'" onclick="toggleGroup(\''+esc(c).replace(/'/g,"\\'")+'\')"><span class="chev">▾</span>'+esc(c)+' <span class="n">· '+byCust[c].length+' lane'+(byCust[c].length>1?'s':'')+'</span></div>'+
   (collapsed?'':byCust[c].map(id=>rowHTML(id,false)).join(''));
  }).join('')+'</div>';
 } else {
  wrap.innerHTML='<div class="listcard">'+colHead(true)+ids.map(id=>rowHTML(id,true)).join('')+'</div>';
 }
 layoutOdCells();
}

/* ---------- drawer: view mode ---------- */
function openLaneDrawer(id){SELECTED=id;renderDrawerView(id);$('drawer').classList.add('open');}
function closeDrawer(){$('drawer').classList.remove('open');SELECTED=null;renderList();}
function timelineHTML(l){
 const chain=chainOf(l);
 if(chain.length<2)return '';
 const rows=chain.map((p,i)=>{
  const isCurrent=p.id===l.id;
  const awardType=i===0?'New award':(provVerb(chain[i-1])==='Renegotiated'?'Renegotiation':'Renewal');
  return '<div class="tlrow'+(isCurrent?' current':'')+'">'+
   '<div><span class="provlink" onclick="openLaneDrawer(\''+p.id+'\')">'+esc(p.code)+'</span>'+(isCurrent?' <span class="tlnow">· viewing</span>':'')+'</div>'+
   '<div>'+windowText(p)+'</div>'+
   '<div>'+statusPill(p)+'</div>'+
   '<div>'+awardType+'</div>'+
  '</div>';
 }).join('');
 return '<div class="sect"><span>RENEWAL TIMELINE</span><span>'+chain.length+' periods</span></div>'+
  '<div class="tlwrap"><div class="tlrow head"><div>Code</div><div>Planned window</div><div>Status</div><div>Award type</div></div>'+rows+'</div>';
}
function renderDrawerView(id){const l=LANES[id];if(!l)return;
 const status=deriveStatus(l);
 const open=status!=='Cancelled';
 const hasSuccessor=!!renewedToLane(l.id);
 const canRenew=open&&!hasSuccessor&&(status==='Expired'||isExpiringSoon(l));
 const canRenegotiate=open&&!hasSuccessor&&status==='Active';
 $('dhead').innerHTML='<div class="top"><span class="lid">'+esc(l.code)+'</span>'+statusPill(l)+'<span class="x" onclick="closeDrawer()">✕</span></div>'+
 '<h2>'+esc(l.customer)+'</h2><div class="meta">'+(l.bcoUnknown?'BCO unknown — broker withheld':esc(l.bco||'—'))+'</div>'+
 '<div class="btns">'+(open
   ?'<button class="abtn" onclick="openEditModal(\''+id+'\')">✎ Edit</button>'
    +(canRenew?'<button class="abtn" onclick="openRenewModal(\''+id+'\')">↻ Renew</button>':'')
    +(canRenegotiate?'<button class="abtn" onclick="openRenegotiateModal(\''+id+'\')">⇄ Renegotiate</button>':'')
    +'<button class="abtn" style="color:var(--red);border-color:#F3C6C6" onclick="openCancelModal(\''+id+'\')">Cancel lane</button>'
   :'<span style="color:var(--gray);font-size:12.5px">Cancelled '+fmtDate(l.actualEnd)+(l.cancelReason?' · '+esc(l.cancelReason):'')+' · new loads no longer match</span>')+
 '</div>';
 let html='';
 if(isExpiringSoon(l)){
  const days=Math.round((new Date(l.plannedEnd)-new Date(TODAY))/86400000);
  html+='<div class="conflictbanner"><div class="t">⚠️ Expiring soon</div><div class="d">Planned end is '+fmtDate(l.plannedEnd)+' — '+days+' day'+(days===1?'':'s')+' away with no renewal yet. Renew or extend to keep matching new loads.</div></div>';
 }
 html+=timelineHTML(l);
 html+='<div class="sect"><span>DETAILS</span></div><div class="dgrid">'+
   drow('Customer lane name',esc(l.name||'— not set'))+
   drow('Customer',esc(l.customer))+
   drow('BCO',l.bcoUnknown?'Unknown — broker withheld':esc(l.bco||'—'))+
   drow('Planned window',windowText(l))+
   drow('Actual start',l.actualStart?fmtDate(l.actualStart):'— not started')+
   drow('Actual end',l.actualEnd?fmtDate(l.actualEnd):'—')+
   (l.actualEnd?drow('Cancellation reason',l.cancelReason?esc(l.cancelReason):'— not given'):'')+
   (l.actualEnd&&l.liableParty?drow('Liable party',esc(l.liableParty)):'')+
   drow('Drop pickup',l.dropPickup?'Yes':'No — live')+
   drow('Drop delivery',l.dropDelivery?'Yes':'No — live')+
 '</div>';
 html+='<div class="sect" style="margin-top:14px"><span>OD PAIRS ('+l.od.length+')</span></div>'+
  l.od.map(p=>'<div class="odview">'+(p.origin?esc(p.origin):'<i>any origin</i>')+' <span style="color:var(--gray)">→</span> '+(p.destination?esc(p.destination):'<i>any destination</i>')+'</div>').join('');
 const mg=groupMatchedByWeek(l.matched);
 if(!mg.recent.length){
  html+='<div class="sect" style="margin-top:14px"><span>MATCHED LOADS</span></div><div style="color:var(--gray);font-size:12.5px;padding:4px 0 2px">No loads auto-matched in the last 4 weeks.</div>';
 } else {
  html+='<div class="sect" style="margin-top:14px"><span>MATCHED LOADS</span><span>'+mg.recent.length+' in the last 4 weeks</span></div>'+
  '<div class="mrow head"><div>Date</div><div>Load</div><div>Ext ID</div><div>Driver</div><div>PU</div><div>DEL</div></div>'+
  mg.weeks.map(wk=>{
   const g=mg.groups[wk];
   return '<div class="mweekhead">'+weekLabel(wk)+'<span class="n">· '+g.length+' load'+(g.length>1?'s':'')+'</span></div>'+
    g.map(m=>'<div class="mrow"><div>'+fmtDateShort(m.date)+'</div><div>'+esc(m.apolloId)+'</div><div>'+esc(m.externalId||'—')+'</div><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.driver||'—')+'</div><div'+(m.latePickup?' class="late"':'')+'>'+esc(m.pu||'—')+'</div><div'+(m.lateDelivery?' class="late"':'')+'>'+esc(m.del||'—')+'</div>'+(m.note?'<div class="note">⚠ '+esc(m.note)+'</div>':'')+'</div>').join('');
  }).join('')+
  '<div style="font-size:11px;color:#94A3B8;margin-top:8px">Auto-matched by customer + OD + planned window — replaces manually cross-referencing the '+(l.customer==='Amazon Relay'?'CA relay schedule':'TX Driver Schedule')+'.</div>';
 }
 $('dtl').innerHTML=html;
}
function drow(k,v){return '<div class="dr"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}

/* ---------- form modal (create / edit / renew / renegotiate) ---------- */
function odRowHTML(idx,origin,destination,existing){
 const oAttrs=existing?' data-orig="'+esc(origin||'')+'" onchange="confirmEditOD(this)"':'';
 const dAttrs=existing?' data-orig="'+esc(destination||'')+'" onchange="confirmEditOD(this)"':'';
 return '<div class="odrow" data-idx="'+idx+'" data-existing="'+(existing?'1':'0')+'">'+
 '<div class="trow2">'+
  '<div class="ti"><div class="row"><div class="txt"><label>Origin*</label>'+
   '<input type="text" list="loclist" data-role="origin" placeholder="— any origin (wildcard) —" value="'+esc(origin||'')+'"'+oAttrs+'></div>'+
   '<span class="icon">'+ICON_CHEVRON+'</span></div></div>'+
  '<div class="ti"><div class="row"><div class="txt"><label>Destination*</label>'+
   '<input type="text" list="loclist" data-role="destination" placeholder="— any destination (wildcard) —" value="'+esc(destination||'')+'"'+dAttrs+'></div>'+
   '<span class="icon">'+ICON_CHEVRON+'</span></div></div>'+
  '<span class="trashbtn" onclick="removeOD('+idx+')" title="Remove">'+ICON_TRASH+'</span>'+
 '</div>'+
 '<div class="hint">Leave one side blank for a wildcard (e.g. Waco → anywhere). Not both.</div>'+
 '<div class="err" id="oderr'+idx+'"></div></div>';
}
let ODCOUNT=0;
function updateOdCount(){const el=$('odcount');if(el)el.textContent=document.querySelectorAll('.odrow').length;}
function addOD(origin,destination,existing){ODCOUNT++;$('odlist').insertAdjacentHTML('beforeend',odRowHTML(ODCOUNT,origin,destination,existing));updateOdCount();}
function removeOD(idx){
 const el=document.querySelector('.odrow[data-idx="'+idx+'"]');
 if(!el)return;
 if(document.querySelectorAll('.odrow').length<=1){toast('A lane needs at least one OD pair.');return;}
 if(el.dataset.existing==='1'){confirmRemoveOD(idx);return;}
 el.remove();updateOdCount();
}
function confirmRemoveOD(idx){
 $('modalbox').innerHTML=dlgHead('Remove OD pair?')+
 '<div class="dbd"><p style="font-size:14px;line-height:20px;color:#1D293D;font-weight:500">This OD pair is already part of the saved lane. Removing it can change which loads auto-match going forward.</p></div>'+
 dlgFoot('<button class="fbtn disruptive" onclick="doRemoveOD('+idx+')">Remove OD pair</button>');
 $('ovl').classList.add('show');
 $('dlgx').onclick=closeModal;
}
function doRemoveOD(idx){closeModal();const el=document.querySelector('.odrow[data-idx="'+idx+'"]');if(el)el.remove();updateOdCount();}
function confirmEditOD(inputEl){
 const orig=inputEl.dataset.orig||'';
 const newVal=inputEl.value.trim();
 if(newVal===orig)return;
 const role=inputEl.dataset.role;
 $('modalbox').innerHTML=dlgHead('Change OD pair?')+
 '<div class="dbd"><p style="font-size:14px;line-height:20px;color:#1D293D;font-weight:500">This OD pair is already part of the saved lane. Changing the '+role+' can change which loads auto-match going forward.</p></div>'+
 dlgFoot('<button class="fbtn primary" id="odeditconfirm">Change OD pair</button>');
 $('ovl').classList.add('show');
 const revert=()=>{inputEl.value=orig;closeModal();};
 $('dlgx').onclick=revert;
 $('odeditconfirm').onclick=()=>{inputEl.dataset.orig=newVal;closeModal();};
}
function toggleBcoUnknown(){const cb=$('in_bcounknown').checked;$('in_bco').disabled=cb;if(cb)$('in_bco').value='';}

function openFormModal(){$('formOvl').classList.add('show');}
function closeFormModal(){$('formOvl').classList.remove('show');}
function openCreateModal(){SELECTED=null;renderForm('create',null);openFormModal();}
function openEditModal(id){renderForm('edit',id);openFormModal();}
function openRenewModal(id){renderForm('renew',id,false);openFormModal();}
function openRenegotiateModal(id){renderForm('renew',id,true);openFormModal();}

let RENEW_OLD=null;
function renewBannerHTML(l,renegotiate){
 if(renegotiate){
  return 'Renegotiating <b>'+esc(l.code)+'</b> (v'+l.version+'). Saving ends '+esc(l.code)+' today (cancelled · reason "Renegotiation") and creates v'+(l.version+1)+' starting today with the new terms, linked back via <code>renewed_from_lane_id</code>. No gap.';
 }
 return 'Renewing <b>'+esc(l.code)+'</b> (v'+l.version+'). '+esc(l.code)+' is untouched and keeps running to its planned end ('+fmtDate(l.plannedEnd)+') — saving creates v'+(l.version+1)+' as a new lane linked back via <code>renewed_from_lane_id</code>. A gap between them is fine.';
}
function onRenegotiateToggle(){
 const reneg=$('in_renegotiate').checked;
 const startEl=$('in_start');
 if(reneg){
  if(!startEl.disabled)startEl.dataset.prev=startEl.value;
  startEl.value=TODAY;startEl.disabled=true;
  $('starthint').textContent='Locked — renegotiation takes effect today.';
 } else {
  startEl.disabled=false;startEl.value=startEl.dataset.prev||'';
  $('starthint').textContent=RENEW_OLD?('Must be on/after '+fmtDate(RENEW_OLD.plannedEnd)+' — '+esc(RENEW_OLD.code)+"'s planned end. A gap is fine; it just can't overlap."):'';
 }
 $('f_liableparty').style.display=reneg?'':'none';
 if(RENEW_OLD)$('renewbanner').innerHTML=renewBannerHTML(RENEW_OLD,reneg);
 const btn=$('dfootSubmit');if(btn)btn.textContent=reneg?'Save renegotiation':'Renew lane';
}

function formFieldsHTML(v,locked,renewCtx){
 renewCtx=renewCtx||null;
 const customerLocked=locked||!!renewCtx;
 const customerHint=locked?'Locked — customer can\'t change on an existing lane. Renew or create a new lane instead.':(renewCtx?'Locked — same customer as '+esc(renewCtx.oldLane.code)+'; it\'s half the lane\'s unique key.':'');
 const startLocked=!!(renewCtx&&renewCtx.renegotiate);
 const startVal=startLocked?TODAY:(v.plannedStart||'');
 const startDisabled=!!v.actualStart||startLocked;
 let startHint='';
 if(startLocked)startHint='Locked — renegotiation takes effect today.';
 else if(renewCtx)startHint='Must be on/after '+fmtDate(renewCtx.oldLane.plannedEnd)+' — '+esc(renewCtx.oldLane.code)+"'s planned end. A gap is fine; it just can't overlap.";
 else if(v.actualStart)startHint='Locked — loads have already matched against this start date';
 const odCount=(v.od&&v.od.length)?v.od.length:1;
 return ''+
 '<div id="conflictzone"></div>'+
 '<div class="fsect"><div class="ttl2">Lane details</div><div class="fgroup">'+
 (renewCtx?(
   '<div style="background:#F6F8FB;border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:8px">'+
    '<label class="cb2"><input type="checkbox" id="in_renegotiate" '+(renewCtx.renegotiate?'checked':'')+' onchange="onRenegotiateToggle()"><span>This is a renegotiation</span></label>'+
    '<div class="hint" style="font-size:11px;line-height:1.5">Terms changed mid-contract — ends '+esc(renewCtx.oldLane.code)+' today (cancelled) and starts the new terms today, no gap. Leave unchecked for a standard renewal, which lets '+esc(renewCtx.oldLane.code)+' run out its planned window untouched.</div>'+
    '<div class="ti" id="f_liableparty" style="'+(renewCtx.renegotiate?'':'display:none')+'"><div class="row"><div class="txt"><label>Cancellation liable party*</label>'+
     '<select id="in_liableparty"><option value="">— select —</option><option value="Carrier">Carrier</option><option value="Customer">Customer</option></select></div>'+
     '<span class="icon">'+ICON_CHEVRON+'</span></div>'+
     '<div class="hint">Who\'s liable for ending '+esc(renewCtx.oldLane.code)+' early.</div><div class="err" id="e_liableparty"></div></div>'+
   '</div>'
 ):'')+
 '<div class="ti'+(customerLocked?' disabled':'')+'" id="f_customer"><div class="row"><div class="txt"><label>Customer*</label>'+
   '<select id="in_customer" '+(customerLocked?'disabled':'')+'>'+
   '<option value="">— select customer —</option>'+
   CUSTOMERS.map(c=>'<option value="'+c+'"'+(v.customer===c?' selected':'')+'>'+c+'</option>').join('')+
   '</select></div><span class="icon">'+ICON_CHEVRON+'</span></div>'+
   (customerHint?'<div class="hint">'+customerHint+'</div>':'')+'<div class="err" id="e_customer"></div></div>'+

 '<div class="ti'+(renewCtx?' disabled':'')+'"><div class="row"><div class="txt"><label>Customer lane name</label>'+
   '<input type="text" id="in_name" placeholder="e.g. Coca-Cola Waco–Houston Production Run" value="'+esc(v.name||'')+'" '+(renewCtx?'disabled':'')+'></div></div>'+
   '<div class="hint">'+(renewCtx?'Locked — stays identical across the whole renewal chain.':'Optional — a free-text label, separate from the lane code')+'</div></div>'+

 '<div class="trow2"><div class="ti"><div class="row"><div class="txt"><label>BCO (beneficial cargo owner)</label>'+
   '<input type="text" id="in_bco" list="bcolist" placeholder="e.g. Niagara Bottling" value="'+esc(v.bcoUnknown?'':(v.bco||''))+'" '+(v.bcoUnknown?'disabled':'')+'></div>'+
   '<span class="icon">'+ICON_CHEVRON+'</span></div><div class="err" id="e_bco"></div></div>'+
  '<div class="ti'+(locked?' disabled':'')+'"><div class="row"><div class="txt"><label>Lane code</label>'+
   '<input type="text" id="in_code" placeholder="e.g. CC-001" value="'+esc(v.code||'')+'" '+(locked?'disabled':'')+'></div></div>'+
   '<div class="hint">'+(locked?'Locked — code can\'t change on an existing lane':'Human-readable — blank auto-generates one')+'</div></div></div>'+
 '<label class="cb2" style="margin-top:-8px"><input type="checkbox" id="in_bcounknown" '+(v.bcoUnknown?'checked':'')+' onchange="toggleBcoUnknown()"><span>Unknown / broker withheld</span></label>'+

 '<div class="trow2"><div class="ti'+(startDisabled?' disabled':'')+'"><div class="row"><div class="txt"><label>Planned start*</label>'+
   '<input type="date" id="in_start" value="'+startVal+'" '+(startDisabled?'disabled':'')+'></div><span class="icon" style="cursor:pointer" onclick="openDatePicker(this)">'+ICON_CALENDAR+'</span></div>'+
   '<div class="hint" id="starthint">'+startHint+'</div><div class="err" id="e_start"></div></div>'+
  '<div class="ti"><div class="row"><div class="txt"><label>Planned end*</label>'+
   '<input type="date" id="in_end" value="'+(v.plannedEnd||'')+'"></div><span class="icon" style="cursor:pointer" onclick="openDatePicker(this)">'+ICON_CALENDAR+'</span></div>'+
   '<div class="err" id="e_end"></div></div></div>'+
 '</div></div>'+

 '<div class="fsect"><div class="ttl2">OD pairs (<span id="odcount">'+odCount+'</span>)</div>'+
  '<div class="fgroup" id="odlist"></div>'+
  '<button type="button" class="fbtn outline full" onclick="addOD()">'+ICON_PLUS+' Add OD pair</button>'+
 '</div>'+

 '<div class="fsect"><div class="ttl2">Pick-up/Delivery</div>'+
  '<div style="display:flex;gap:16px;align-items:center">'+
   '<label class="cb2"><input type="checkbox" id="in_droppu" '+(v.dropPickup?'checked':'')+'><span>Drop pickup</span></label>'+
   '<label class="cb2"><input type="checkbox" id="in_dropdel" '+(v.dropDelivery?'checked':'')+'><span>Drop delivery</span></label>'+
  '</div></div>'+
 '<datalist id="loclist">'+LOCATIONS.map(l=>'<option value="'+l+'">').join('')+'</datalist>'+
 '<datalist id="bcolist">'+BCOS.map(b=>'<option value="'+b+'">').join('')+'</datalist>';
}

function renderForm(mode,id,renegotiate){
 renegotiate=!!renegotiate;
 const l=id?LANES[id]:null;
 RENEW_OLD=(mode==='renew')?l:null;
 const title=mode==='create'?'Create lane':mode==='edit'?'Edit lane — '+esc(l.code):(renegotiate?'Renegotiate lane — '+esc(l.code):'Renew lane — '+esc(l.code));
 const subtitle=mode==='create'?'Customer, OD pair(s) and planned dates create a valid lane — no engineering needed.':null;

 const v=mode==='create'?{customer:'',name:'',bco:'',bcoUnknown:false,code:'',plannedStart:'',plannedEnd:'',dropPickup:false,dropDelivery:false,od:[{origin:'',destination:''}]}
  :mode==='edit'?l
  :{customer:l.customer,name:l.name,bco:l.bco,bcoUnknown:l.bcoUnknown,code:suggestRenewCode(l),plannedStart:renegotiate?TODAY:'',plannedEnd:'',dropPickup:l.dropPickup,dropDelivery:l.dropDelivery,od:l.od};

 let body='';
 if(mode==='renew'){body+='<div class="provbanner" id="renewbanner">'+renewBannerHTML(l,renegotiate)+'</div>';}
 body+=formFieldsHTML(v,mode==='edit',mode==='renew'?{oldLane:l,renegotiate}:null);

 const submitLabel=mode==='create'?'Create lane':mode==='edit'?'Save changes':(renegotiate?'Save renegotiation':'Renew lane');
 $('formModalBox').innerHTML=dlgHead(title,subtitle,'fdlgx')+
  '<div class="dbd">'+body+'</div>'+
  dlgFoot('<button class="fbtn primary" id="dfootSubmit" onclick="submitForm(\''+mode+'\',\''+(id||'')+'\')">'+submitLabel+'</button>');
 $('fdlgx').onclick=closeFormModal;

 ODCOUNT=0;$('odlist').innerHTML='';
 (v.od&&v.od.length?v.od:[{origin:'',destination:''}]).forEach(p=>addOD(p.origin,p.destination,mode==='edit'));
}

function clearErrors(){document.querySelectorAll('.err').forEach(e=>e.textContent='');}
function showErr(id,msg){const el=$(id);if(el)el.textContent=msg;}

function submitForm(mode,id){
 clearErrors();$('conflictzone').innerHTML='';
 const customer=$('in_customer').value;
 const name=$('in_name').value.trim();
 const bcoUnknown=$('in_bcounknown').checked;
 const bco=bcoUnknown?'':$('in_bco').value.trim();
 const codeInput=$('in_code').value.trim();
 const start=$('in_start').value;
 const end=$('in_end').value;
 const dropPickup=$('in_droppu').checked;
 const dropDelivery=$('in_dropdel').checked;
 const odEls=[...document.querySelectorAll('.odrow')];
 const odRaw=odEls.map(el=>({origin:el.querySelector('[data-role=origin]').value.trim(),destination:el.querySelector('[data-role=destination]').value.trim(),_el:el}));

 let ok=true;
 if(!customer){showErr('e_customer','Pick a customer.');ok=false;}
 if(!start){showErr('e_start','Planned start is required.');ok=false;}
 if(!end){showErr('e_end','Planned end is required.');ok=false;}
 if(start&&end&&end<start){showErr('e_end','End date can’t be before the start date.');ok=false;}
 if(mode==='renew'){
  const isReneg=$('in_renegotiate').checked;
  if(!isReneg&&start&&start<LANES[id].plannedEnd){showErr('e_start',"Must be on/after "+fmtDate(LANES[id].plannedEnd)+" — "+esc(LANES[id].code)+"'s planned end, so a load can't match two lanes.");ok=false;}
  if(isReneg&&!$('in_liableparty').value){showErr('e_liableparty','Pick who is liable — carrier or customer.');ok=false;}
 }
 odRaw.forEach(p=>{const errEl=p._el.querySelector('.err');if(!p.origin&&!p.destination){errEl.textContent='Needs an origin or a destination — can’t wildcard both.';ok=false;}else errEl.textContent='';});
 if(!ok)return;

 const cleanOd=odRaw.map(p=>({origin:p.origin||null,destination:p.destination||null}));
 const excludeIds=(mode==='edit'||mode==='renew')?[id]:[];
 const conflict=findConflict(customer,cleanOd,start,end,excludeIds);
 if(conflict){
  $('conflictzone').innerHTML='<div class="conflictbanner"><div class="t">⚠️ Conflicts with an existing lane</div>'+
   '<div class="d"><b>'+esc(conflict.lane.code)+'</b> ('+esc(conflict.lane.customer)+') already covers <b>'+esc(odLabel(conflict.lp))+'</b> for '+windowText(conflict.lane)+'. Two active lanes can’t claim the same load — adjust the dates/OD or view the existing lane.</div>'+
   '<div class="btns"><button class="abtn" onclick="closeFormModal();openLaneDrawer(\''+conflict.lane.id+'\')">View '+esc(conflict.lane.code)+'</button></div></div>';
  $('conflictzone').scrollIntoView({behavior:'smooth',block:'start'});
  return;
 }

 const code=codeInput||autoCode(customer);
 if(mode==='create'){
  const newId=idFromCode(code);
  LANES[newId]={id:newId,customer,name:name||null,bco,bcoUnknown,code,version:1,
   plannedStart:start,plannedEnd:end,actualStart:(start>TODAY?null:start),actualEnd:null,
   loadType:null,dropPickup,dropDelivery,renewedFrom:null,od:cleanOd,matched:[]};
  closeFormModal();renderList();openLaneDrawer(newId);
  toast('Lane created — Apollo will begin auto-matching loads within this window.');
 } else if(mode==='edit'){
  Object.assign(LANES[id],{customer,name:name||null,bco,bcoUnknown,code,plannedStart:start,plannedEnd:end,dropPickup,dropDelivery,od:cleanOd});
  closeFormModal();renderList();renderDrawerView(id);
  toast('Saved — no new lane version created.');
 } else if(mode==='renew'){
  const old=LANES[id];
  const isReneg=$('in_renegotiate').checked;
  const newId=idFromCode(code);
  if(isReneg){
   const liableParty=$('in_liableparty').value;
   old.actualEnd=TODAY;old.cancelReason='Renegotiation';old.liableParty=liableParty;
   LANES[newId]={id:newId,customer,name:name||null,bco,bcoUnknown,code,version:old.version+1,
    plannedStart:TODAY,plannedEnd:end,actualStart:TODAY,actualEnd:null,
    loadType:old.loadType,dropPickup,dropDelivery,renewedFrom:id,od:cleanOd,matched:[]};
   closeFormModal();renderList();openLaneDrawer(newId);
   toast(esc(old.code)+' cancelled (renegotiation) · new terms on '+esc(code)+' (v'+LANES[newId].version+') start today.');
  } else {
   LANES[newId]={id:newId,customer,name:name||null,bco,bcoUnknown,code,version:old.version+1,
    plannedStart:start,plannedEnd:end,actualStart:(start>TODAY?null:start),actualEnd:null,
    loadType:old.loadType,dropPickup,dropDelivery,renewedFrom:id,od:cleanOd,matched:[]};
   closeFormModal();renderList();openLaneDrawer(newId);
   toast(esc(code)+' created — renewed from '+esc(old.code)+' (v'+LANES[newId].version+'); '+esc(old.code)+' continues unchanged until it expires.');
  }
 }
}

/* ---------- cancel lane modal ---------- */
function openCancelModal(id){const l=LANES[id];
 $('modalbox').innerHTML=dlgHead('Cancel lane '+esc(l.code),"New loads after this date won't auto-match to "+esc(l.code)+'. Everything already logged stays intact.')+
 '<div class="dbd">'+
  '<div class="ti"><div class="row"><div class="txt"><label>Actual end date*</label>'+
   '<input type="date" id="in_canceldate" value="'+TODAY+'"></div><span class="icon" style="cursor:pointer" onclick="openDatePicker(this)">'+ICON_CALENDAR+'</span></div></div>'+
  '<div class="ti"><div class="row"><div class="txt"><label>Reason for cancellation</label>'+
   '<input type="text" id="in_cancelreason" placeholder="e.g. Customer paused shipments, lane consolidated into another lane, rate renegotiation fell through"></div></div>'+
   '<div class="hint">Optional — shown on the lane\'s detail view</div></div>'+
 '</div>'+
 dlgFoot('<button class="fbtn disruptive" onclick="confirmCancel(\''+id+'\')">Cancel lane</button>');
 $('ovl').classList.add('show');
 $('dlgx').onclick=closeModal;}
function confirmCancel(id){const d=$('in_canceldate').value||TODAY;const r=$('in_cancelreason').value.trim();
 LANES[id].actualEnd=d;LANES[id].cancelReason=r||null;closeModal();renderList();
 if(SELECTED===id)renderDrawerView(id);
 toast(esc(LANES[id].code)+' cancelled — stops matching new loads after '+fmtDate(d)+'.');}
function closeModal(){$('ovl').classList.remove('show');}

/* ---------- boot ---------- */
seedLanes();
$('groupToggle').addEventListener('change',e=>{GROUPBY=e.target.checked;renderList();});
renderList();
</script>
