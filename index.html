<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailer Pool — Apollo by Nevoya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
/* Tokens — mirrors shared/tokens.css + confirmed Figma pulls in
   .claude/skills/nevoya-prototype/references/nevoya-library.md (Button, Status chip,
   Filter chip, Table, Navigation, Dialog). Don't hand-tune hexes here without
   checking that reference first. */
:root{
  --teal:#00786F;--teal-soft:#F0FDFA;
  --ink:#0F172B;--text-dark:#1D293D;--text-default:#314158;--text-muted:#45556C;--gray:#62748E;
  --bg:#F7F7F8;--surface-lowest:#F6F8FB;--surface-low:#E6EFFA;--surface-default:#E1EAF5;--surface-high:#DAE3ED;
  --border-default:#CAD5E2;--border-muted:#E2E8F0;
  --red:#E7000B;--redsoft:#FFE2E2;
  --amber:#E17100;--ambersoft:#FEF3C6;
  --green:#007A55;--greensoft:#D0FAE5;
  --slate:#1D293D;--slatesoft:#E6EFFA;
  /* Blue Status chip pair (shared/tokens.css --status-bg-blue-in-progress /
     Icon/blue-in-progress) — reused here for "Over target" and, on trailer
     rows, "In Transit - Loaded". */
  --blue:#155DFC;--bluesoft:#DBEAFE;
  /* Violet/cyan/stone Status chip pairs (shared/tokens.css
     --status-bg-violet-dispatched, --status-bg-cyan/--chip-cyan,
     --status-bg-stone-cancelled/--chip-stone-cancelled) — used for the
     per-trailer "At Load Pickup" / "At Load Delivery" / "In Transit -
     Empty" statuses below. */
  --violetsoft:#EDE9FE;--cyan:#007595;--cyansoft:#CEFAFE;--stone:#44403B;--stonesoft:#F5F5F4;
  /* Load chip status-dot colors (shared/tokens.css Icon/*) */
  --icon-emerald-success:#009966;--icon-fuschia-pending:#c800de;--icon-stone-cancelled:#79716b;
  --icon-blue-in-progress:#155dfc;--icon-violet-dispatched:#7f22fe;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;font-size:14px}
#app{display:flex;height:100vh}
/* rail (matches lanes/index.html) */
#rail{width:64px;background:#fff;border-right:1px solid var(--border-muted);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex:none}
#rail .logo{width:34px;height:34px;border-radius:8px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-bottom:10px}
#rail .ric{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#475569;position:relative}
#rail .ric:hover{background:var(--surface-lowest)}
/* Selected nav item = background/high, NOT a teal tint (confirmed Figma spec). */
#rail .ric.active{background:var(--surface-high);color:var(--text-dark)}
#rail .ric.ghost{opacity:.38;cursor:default}
#rail .tz{margin-top:auto;font-size:11px;color:var(--gray);font-weight:500}
#rail .tip{position:absolute;left:52px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;display:none;z-index:50}
#rail .ric:hover .tip{display:block}
/* main */
#maincol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#poolhead{padding:18px 26px 16px;flex:none}
#poolhead .top{display:flex;align-items:center;gap:14px}
#poolhead h1{font-size:26px;font-weight:500}
/* Button (confirmed Figma spec): Primary teal / Outline border-default / Disruptive red. */
.abtn{border:1px solid var(--border-default);background:#fff;border-radius:8px;font-size:13px;font-weight:600;padding:7px 12px;cursor:pointer;font-family:inherit;color:var(--text-dark)}
.abtn:hover{background:var(--surface-lowest)}
.abtn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.abtn.primary:hover{background:var(--teal);opacity:.9}
.abtn.disruptive{background:var(--red);border-color:var(--red);color:#fff}
.abtn.ghost{border-color:transparent;background:transparent}
.abtn.ghost:hover{background:var(--surface-lowest)}
.abtn:disabled{opacity:.3;cursor:not-allowed}
/* Segmented control (confirmed Figma spec 46:583/49:580): background/default
   container, white selected segment, Selector/Dark text — not a teal tint.
   Lives in .searchrow now (compact toolbar sizing, matches the search
   input's height) rather than its own full-width header row. */
.viewtoggle{display:inline-flex;background:var(--surface-default);padding:3px;border-radius:8px;gap:0;flex:none}
/* Custom chevron over an appearance:none select — matches height with the
   segmented toggle beside it and swaps the native OS arrow for our icon set. */
.selectwrap{position:relative;display:inline-flex;align-items:center;flex:none}
.searchrow .selectwrap{margin-left:auto}
.selectwrap .chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--gray)}
/* Shared appearance:none select treatment — Region (search row) and
   Type/Flags/Status (All Trailers filter row) all use the same custom
   chevron instead of a mix of native-arrow and custom-chevron selects. */
.ddselect{appearance:none;-webkit-appearance:none;height:34px;border:1px solid var(--border-default);border-radius:8px;padding:0 30px 0 12px;font-size:13px;font-weight:500;font-family:inherit;color:var(--text-dark);background:#fff;cursor:pointer}
.ddselect:hover{background:var(--surface-lowest)}
.ddselect:focus{outline:none;border-color:var(--teal)}
.viewtoggle button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-default);cursor:pointer;font-family:inherit;white-space:nowrap}
.viewtoggle button.active{background:#fff;color:var(--ink);font-weight:600}
.toolbar{display:flex;align-items:center;gap:8px;padding:0 0 10px;flex-wrap:wrap;flex:none}
/* Filter chip (confirmed Figma spec: default border-default/white, selected teal border/teal-soft bg). */
.chip{border:1px solid var(--border-default);border-radius:8px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--text-default)}
.chip.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
/* Group-by toggle — matches the lanes prototype's .gtoggle/.switch exactly.
   On = group by account; off = fall back to the location-type grouping. */
.gtoggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-default);margin-left:auto;cursor:pointer;user-select:none;white-space:nowrap}
.switch{position:relative;width:40px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:#99A1AF;border-radius:8px;transition:background .15s ease;cursor:pointer}
.switch .thumb{position:absolute;top:2px;left:2px;width:22px;height:16px;background:#fff;border-radius:6px;transition:transform .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
.switch input:checked+.track{background:var(--teal)}
.switch input:checked+.track .thumb{transform:translateX(14px)}
.searchrow{padding:0 0 10px;flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.searchrow input{flex:1;min-width:120px;max-width:260px;border:1px solid var(--border-default);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--text-dark)}
.searchrow input:focus{border-color:var(--teal)}
.atfilters{padding:0 0 10px;flex:none}
/* Type/Flags/Status are plain <select> dropdowns now (no exposed chips, no
   "More" overflow panel), styled via .ddselect/.selectwrap — same custom-
   chevron treatment as Region. The toggle anchors the row on the left,
   Include Archived keeps the group-by-style switch treatment on the right. */
.atf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* split content: map (left) + pool table (right) — mirrors the real Trailers
   page's grid-cols-2 map/table layout in the apollo app. */
#content{flex:1;min-height:0;display:flex;gap:0;padding:10px 26px 16px}
#mapcol{flex:1;min-width:220px;border-radius:16px;border:1px solid var(--border-muted);position:relative;overflow:hidden}
/* Default split: 1/3 map, 2/3 table (flex:1 vs flex:2) — the drag handle
   still overrides this per-session via an explicit pixel flex-basis. */
/* drag handle between the map and the table — dragging resizes #mapcol;
   #tablecol is flex:1 so it always fills whatever space is left over. */
#resizer{flex:0 0 17px;margin:0 -1px;cursor:col-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
#resizer .grip{width:4px;height:56px;border-radius:3px;background:var(--border-default);transition:background .12s}
#resizer:hover .grip,#resizer.dragging .grip{background:var(--teal)}
#mapEl{position:absolute;inset:0;background:var(--surface-lowest)}
#mapcol .maplabel{position:absolute;top:12px;right:56px;z-index:500;font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--gray);text-transform:uppercase;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:6px;pointer-events:none}
.autozoom-card{position:absolute;top:12px;left:14px;z-index:500;background:#fff;border-radius:10px;padding:8px 10px 8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;user-select:none}
.azswitch{width:34px;height:19px;border-radius:10px;background:var(--border-default);position:relative;transition:background .15s;flex:none}
.azswitch::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.autozoom-card.on .azswitch{background:var(--teal)}
.autozoom-card.on .azswitch::after{left:17px}
/* Leaflet divIcon content — the marker itself; Leaflet positions/anchors the
   wrapping .leaflet-marker-icon, so this only needs its own visual shape. */
.pin{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.pin.p-ontarget{background:var(--green)}
.pin.p-belowtarget{background:var(--amber)}
.pin.p-critical{background:var(--red)}
.pin.p-notarget{background:var(--gray)}
.pin .pn{transform:rotate(45deg);color:#fff;font-size:10.5px;font-weight:700;line-height:1}
/* individual trailer marker — shown once a location is zoomed/clicked into,
   styled after the real apollo map's yard-level trailer badges (dark circle,
   small container icon, laid out like trailers parked in a lot). */
.trailerdot{position:relative;width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
.trailerdot.td-gps{background:#1D4F49}
.trailerdot.td-manual{background:var(--amber)}
.trailerdot svg{width:14px;height:14px}
/* PM-due flag: a glanceable badge, no hover needed — Amanda-flags-PMs concept.
   Amber, not red — routine maintenance due isn't an urgent/critical problem. */
.trailerdot.pmdue::after{content:'';position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:1.5px solid #fff}
.trailerdot.flash{animation:dotpulse .9s ease 2}
.pin.flash{animation:pinpulse .9s ease 2}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes pinpulse{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.5)}}
/* Trailer card overlay — richer than a single-line tooltip: DVIR/PM flags. */
.leaflet-tooltip.trailercard{padding:10px 12px;min-width:190px}
.trailercard .tc-id{font-weight:600;font-size:13px;color:var(--ink);margin-bottom:5px}
.trailercard .tc-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-default);line-height:1.7}
/* Same text treatment as .tc-row above, for the GPS/Manual · last-ping
   callout reused in the All Trailers list and expanded trailers table. */
.srcping{font-size:11.5px;color:var(--text-default);white-space:nowrap;text-overflow:ellipsis}
/* Status rows (DVIR/PM flags) get a divider off the identity line above,
   so the card reads as two grouped sections instead of one flat stack. */
.trailercard .tc-status{margin-top:5px;padding-top:5px;border-top:1px solid var(--border-muted);display:flex;flex-direction:column;gap:1px}
/* Kill the default focus-ring browsers put on the clicked marker element —
   it reads as a stray blue box, not a deliberate selection state. */
.leaflet-marker-icon:focus{outline:none}
.leaflet-tooltip.poolTip{font-family:Inter,-apple-system,sans-serif;font-size:11px;padding:4px 8px}

/* 480px floor (not 340px) — below that, the All Trailers list's 5 columns
   (id, status pill, location, days, load chip) can't all fit without
   wrapping/overflowing regardless of fr tuning; keep the resizer's minTable
   below in sync with this. */
#tablecol{flex:2;min-width:480px;display:flex;flex-direction:column;min-height:0}
/* Table (confirmed Figma spec): lowest bg, 12px padding, 16px radius, Border/Muted row dividers. */
/* Table card (matches the lanes prototype's .listcard: white card on the
   light-gray page, not a same-tone fill that blends into it). */
#listwrap{flex:1;overflow:auto;background:#fff;border:1px solid var(--border-muted);border-radius:10px;padding:0}
/* colHead() now renders once at the very top of the whole list (see
   renderList) — it owns top:0/the higher z-index; each group's sechead
   sticks just underneath it as you scroll past. Sechead keeps a light tint
   (like lanes' grouphead) so it reads as a section band on the white card. */
.colhead{display:grid;grid-template-columns:1.15fr 1fr .8fr 1.1fr .5fr 20px;gap:10px;padding:10px 16px;font-size:11px;letter-spacing:.3px;color:var(--gray);font-weight:600;border-bottom:1px solid var(--border-muted);background:#fff;position:sticky;top:0;z-index:2}
.poolrow{display:grid;grid-template-columns:1.15fr 1fr .8fr 1.1fr .5fr 20px;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-muted);cursor:pointer;font-size:13.5px;background:#fff}
.poolrow:hover{background:var(--surface-low)}
.poolrow.flash{background:var(--surface-high)}
.poolrow .loc{font-weight:500;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--text-dark)}
.poolrow .loc .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poolrow .loc .acct{color:var(--gray);font-size:11.5px;font-weight:400}
.poolrow .count{color:var(--text-default);display:flex;flex-direction:column;gap:1px}
.poolrow .count .cnums{font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.poolrow .count b{font-weight:600;color:var(--ink)}
.poolrow .loadedempty{color:var(--text-default);font-size:12.5px;white-space:nowrap}
.poolrow .loadedempty b{font-weight:600;color:var(--ink)}
.poolrow .target{color:var(--text-default);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:5px}
.poolrow .chev2{color:#CBD5E1;transition:transform .15s}
.poolrow.expanded .chev2{transform:rotate(90deg)}
/* Inline expanded-row detail — sits as its own full-width block right under
   the row it belongs to (a flow sibling, not a grid cell), reusing the same
   banner/table components the old drawer view rendered. */
.rowexpand{padding:16px 20px 20px;background:var(--surface-lowest);border-bottom:1px solid var(--border-muted);cursor:default}
.rowexpand .sect{font-size:11px;letter-spacing:1px;color:var(--gray);font-weight:600;margin-bottom:10px;display:flex}
.rowexpand .sect span:last-child{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}
.rowexpand .sect:not(:first-child){margin-top:14px}
/* Status chip (confirmed Figma spec — source of truth for status pill colors).
   nowrap: a two-word status like "Below target" must stay on one line, same
   as every pill in the lanes reference — never let a chip wrap. */
.pill{border-radius:16px;padding:3px 11px;font-size:12px;font-weight:600;display:inline-block;letter-spacing:.2px;white-space:nowrap}
.p-ontarget{background:var(--greensoft);color:var(--green)}
.p-belowtarget{background:var(--ambersoft);color:var(--amber)}
/* Same amber as Below target for now — "Low" is a placeholder status
   pending real design guidance on how it should read differently. */
.p-low{background:var(--ambersoft);color:var(--amber)}
.p-overtarget{background:var(--bluesoft);color:var(--blue)}
.p-critical{background:var(--redsoft);color:var(--red)}
.p-notarget{background:var(--slatesoft);color:var(--slate)}
.p-available{background:var(--greensoft);color:var(--green)}
.p-unknown{background:var(--slatesoft);color:var(--slate)}
/* Per-trailer status vocabulary (All Trailers list) beyond Available/
   Unknown/Archived above — At Hub Stop (Nevoya-owned yards), At Load
   Pickup/Delivery (shipper pools vs. one-off customer docks), and the two
   in-transit states for trailers pulled in from each location's en-route
   list. */
.p-hubstop{background:var(--teal-soft);color:var(--teal)}
.p-pickup{background:var(--violetsoft);color:var(--icon-violet-dispatched)}
.p-delivery{background:var(--cyansoft);color:var(--cyan)}
.p-transit{background:var(--bluesoft);color:var(--blue)}
.p-transitempty{background:var(--stonesoft);color:var(--stone)}
.lid{background:var(--surface-default);border-radius:6px;padding:3px 9px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
/* Load chip (Figma node 68:102) — status dot + label, rounded-full pill.
   Use this wherever a load reference is shown; use .lid for plain id chips. */
.loadtag{background:var(--surface-default);border-radius:16px;padding:3px 11px 3px 8px;font-weight:600;font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--text-dark);white-space:nowrap}
.loadtag .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- All Trailers (flat) view — lives in #tablecol next to the map,
   swapped in for #listwrap; same Table look as the pools list. ---------- */
#poolToolbar.hidden{display:none}
#allTrailersList{flex:1;overflow:auto;background:#fff;border:1px solid var(--border-muted);border-radius:10px}
/* minmax() per column, not plain fr: guarantees each column a pixel floor
   (pill/chip content has a real minimum size that fr alone can't protect)
   while letting Current Location claim the rest. If the combined floors
   ever exceed the available width, #allTrailersList's overflow:auto turns
   that into a horizontal scrollbar instead of squished/overlapping cells. */
.atcolhead{display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(120px,.9fr) minmax(140px,1fr) minmax(130px,1.4fr) minmax(75px,.6fr) minmax(95px,.9fr) minmax(64px,.5fr);gap:10px;padding:10px 16px;font-size:11px;letter-spacing:.3px;color:var(--gray);font-weight:600;border-bottom:1px solid var(--border-muted);background:#fff;position:sticky;top:0;z-index:1}
.atrow{display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(120px,.9fr) minmax(140px,1fr) minmax(130px,1.4fr) minmax(75px,.6fr) minmax(95px,.9fr) minmax(64px,.5fr);gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-muted);font-size:13.5px;background:#fff;color:var(--text-dark);cursor:pointer}
.atrow:hover{background:var(--surface-low)}
.atrow.archived{opacity:.6}
.atrow .tid{font-weight:500;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;min-width:0}
/* Trailer name reads as a link — same affordance as lanes' .provlink — even
   though it doesn't navigate anywhere yet (no detail view to send it to). */
.atrow .tidlink:hover{text-decoration:underline}
.atrow .loc2{color:var(--text-default);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atrow .days2{color:var(--gray);font-size:12.5px;white-space:nowrap}
/* min-width:0 on every grid-item cell is load-bearing: each .atrow is its
   own independent grid instance, and white-space:nowrap text otherwise
   reports its full unwrapped width as min-content, forcing that row's
   track wider than its fr share (and shrinking its neighbors) — which is
   what was throwing column widths out of sync row-to-row before this. */
.atrow>div{min-width:0;overflow:hidden}
/* .rowactions holds an absolutely-positioned dropdown menu that needs to
   spill below the row — override the blanket overflow:hidden above. */
.atrow>div.rowactions{overflow:visible}
.rowactions{display:flex;align-items:center;justify-content:flex-end;gap:2px;position:relative}
.rowicon{opacity:0;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;color:var(--gray);cursor:pointer;border-radius:6px}
.atrow:hover .rowicon,.rowicon.menuopen{opacity:1}
.rowicon:hover{background:var(--surface-lowest);color:var(--teal)}
.rowmenu{position:absolute;top:100%;right:0;margin-top:4px;background:#fff;border:1px solid var(--border-default);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);min-width:180px;z-index:60;padding:4px;display:flex;flex-direction:column}
.rowmenu button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;color:var(--text-dark);border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap}
.rowmenu button:hover{background:var(--surface-lowest)}
.rowmenu button.danger{color:var(--red)}
.emptysec{padding:16px;color:var(--gray);font-size:12.5px}
.infoq{cursor:help;color:var(--gray);font-size:10px}
.critbanner{background:var(--redsoft);border:1px solid #F3ACAC;border-radius:8px;padding:12px 14px;margin-bottom:16px}
.critbanner .t{font-weight:600;font-size:13.5px;color:var(--red);display:flex;align-items:center;gap:6px}
.critbanner .d{font-size:12.5px;color:#8A0009;margin-top:5px;line-height:1.5}
/* Trailer / Status / From / Arrived / Last Load. minmax() per column (not
   plain fr) + min-width:0 on every cell — same reasoning as the All
   Trailers table: each .trow is its own independent grid instance, and
   without a floor + min-width:0, one row's longer content desyncs that
   row's tracks from its neighbors. */
.trow{display:grid;grid-template-columns:minmax(100px,1.1fr) minmax(90px,.8fr) minmax(110px,1fr) minmax(110px,1.1fr) minmax(120px,1.1fr) minmax(85px,.8fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--border-muted);font-size:12px;align-items:center;cursor:pointer;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:6px}
.trow:not(.head):hover{background:var(--surface-low)}
/* Trailer name reads as a link — same affordance as .atrow .tidlink/lanes'
   .provlink — even though there's no detail view to send it to yet. */
.trow:hover .tidname{text-decoration:underline}
.trow.head{cursor:default}
.trow.head{color:var(--gray);font-size:10.5px;letter-spacing:.4px;font-weight:600;border-bottom:1px solid var(--border-default)}
.trow>div,.erow>div{min-width:0;overflow:hidden}
.trow .from,.trow .arr,.trow .loc2{color:var(--text-default);white-space:nowrap;text-overflow:ellipsis}
.trow.noyard{grid-template-columns:minmax(90px,.9fr) minmax(160px,1.3fr) minmax(125px,1fr) minmax(100px,.95fr) minmax(90px,.75fr) minmax(110px,.9fr) minmax(70px,.6fr)}
/* Planned table — upcoming hook/drop activity at this location, same row
   rhythm as .trow above. Not clickable: there's no trailer detail view for
   a not-yet-assigned trailer to link to. */
.erow{display:grid;grid-template-columns:minmax(65px,.65fr) minmax(120px,1.05fr) minmax(85px,.75fr) minmax(150px,1.35fr) minmax(75px,.7fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--border-muted);font-size:12px;align-items:center;margin:0 -6px;padding-left:6px;padding-right:6px}
.erow.head{color:var(--gray);font-size:10.5px;letter-spacing:.4px;font-weight:600;border-bottom:1px solid var(--border-default)}
.erow .time{color:var(--text-default);white-space:nowrap;text-overflow:ellipsis}
.erow .bal{color:var(--text-dark);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px}
.underdeficit{color:var(--gray);font-size:11px;font-weight:400;white-space:nowrap}
.underdeficit .unum{color:var(--red)}
/* PM is a flag (badge) inline on the trailer id, not its own column. */
/* PM-due flag — just the icon, no pill/background; hover shows context via
   the shared .hovertip (matches the lanes prototype's "Expiring soon" flag). */
.pmflag{display:inline-flex;align-items:center;gap:4px;vertical-align:-2px;cursor:default;color:var(--ink);font-weight:400;font-size:12px}
/* Preventative-maintenance callout — amber icon + plain-weight black label,
   matching the surrounding table type. Shared between the expandable-row
   trailers table and the map's trailer card. Hover still gives the due-date
   context via the shared .hovertip (or a native title on the map card). */
.pmcallout{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:400;font-size:12px;cursor:help}
/* Shared hover tooltip — fixed to body so it escapes any scroll clipping. */
.hovertip{position:fixed;display:none;background:var(--ink);color:#fff;font-size:11px;font-weight:400;padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:250;pointer-events:none}
.hovertip.show{display:block}
.emptytrailers{color:var(--gray);font-size:12.5px;padding:10px 0 2px}
/* form */
.ffield{flex:1;display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.ffield label{font-size:12px;color:var(--text-default);font-weight:500}
.ffield input[type=text],.ffield input[type=number],.ffield select,.ffield textarea{border:1px solid var(--border-default);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;width:100%;color:var(--text-dark)}
.ffield textarea{resize:vertical;min-height:80px}
.ffield input:focus,.ffield select:focus,.ffield textarea:focus{border-color:var(--teal)}
.ffield .hint{font-size:11px;color:#94A3B8}
/* Section header inside a long modal body (Edit Trailer) — a rule above
   every section but the first, same weight as a field label but bolder. */
.dbd .fsect{font-size:13px;font-weight:600;color:var(--ink);padding-top:14px;border-top:1px solid var(--border-muted)}
.dbd .fsect:first-child{padding-top:0;border-top:none}
/* Two related fields sharing one row (License Plate Number/State, Make/
   Model, ...) — .ffield's existing flex:1 already assumes a flex-row
   parent, so this is the only new rule needed. */
.ffieldrow{display:flex;gap:10px}
.ffieldrow .ffield{margin-bottom:0}
.radiorow{display:flex;gap:22px;padding:2px 0}
.radioopt{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:var(--text-dark)}
.radioopt input[type=radio]{width:18px;height:18px;accent-color:var(--teal);cursor:pointer;margin:0}
.dollarinput{position:relative}
.dollarinput input{padding-left:22px!important}
.dollarinput .dsign{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:13.5px;pointer-events:none}
.toast{position:fixed;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;border-radius:8px;padding:9px 16px;font-size:13.5px;z-index:300;max-width:80vw;text-align:center}
svg.ic{display:block}
/* Dialog (confirmed Figma spec, node 80:208 — see nevoya-library.md): header
   Title/Large 20px semibold + optional subtitle + ghost close button;
   footer Secondary+Primary button pair, gap, justified end; both header/
   footer padding:12px radius/sm(8px). Same structure the lanes prototype's
   .dlg/#ovl already implements — mirrored here token-for-token. */
.dlg{background:#fff;border:1px solid var(--border-muted);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.dlg .dhd{padding:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex:none}
.dlg .dhd .tw{display:flex;flex-direction:column;gap:4px;min-width:0}
.dlg .dhd .ttl{font-size:20px;line-height:28px;font-weight:600;color:var(--ink)}
.dlg .dhd .sub{font-size:14px;line-height:20px;font-weight:500;color:var(--gray)}
.dlg .dhd .x{cursor:pointer;color:var(--gray);min-width:32px;min-height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.dlg .dhd .x:hover{background:var(--surface-lowest)}
.dlg .dbd{padding:12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.dlg .dft{padding:12px;display:flex;gap:8px;flex:none;border-top:1px solid var(--border-muted)}
.dlg .dft .grp{flex:1;display:flex;gap:8px;justify-content:flex-end}
/* z-index:2000 — comfortably above Leaflet's own stacking (its panes/
   controls run up to z-index:1000), which otherwise rendered on top of the
   modal instead of being dimmed behind it. */
#ovl{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:2000}
#ovl.show{display:flex}
/* Height stays content-driven (auto), not fixed — a one-field Edit Target
   or Flag Trailer modal should stay compact; max-height is just a safety
   cap so a long form (Edit Trailer) scrolls internally instead of running
   off the viewport. */
#ovl .dlg{width:420px;max-width:92vw;max-height:88vh}
/* Row-hover edit-target affordance — same "reveal on row hover" idiom as the
   lanes prototype's .provlink, just a pencil icon-button instead of a link.
   stopPropagation keeps the click from also firing the row's own onclick
   (which opens the location drawer). */
.targetedit{opacity:0;display:inline-flex;align-items:center;color:var(--gray);cursor:pointer;padding:2px;border-radius:4px}
.poolrow:hover .targetedit{opacity:1}
.targetedit:hover{background:var(--surface-lowest);color:var(--teal)}
</style>

function toast(t){
 const d=document.createElement('div');
 d.className='toast';
 d.textContent=t;
 document.body.appendChild(d);

    rail's width skews it and, at narrower widths, it can end up sitting
    entirely over the table instead of spanning both panes. */
 const r=$('maincol').getBoundingClientRect();
 d.style.left=(r.left+r.width/2)+'px';
 setTimeout(()=>d.remove(),3200);
}

 t.classList.add('show');
 const r=el.getBoundingClientRect();
 t.style.top=(r.bottom+6)+'px';
 t.style.left=Math.max(8,Math.min(r.left,window.innerWidth-t.offsetWidth-8))+'px';
}

  ]}
};
OTHER={
 'ONT-DOCK':{id:'ONT-DOCK',name:'Ontario DC — Customer Dock',account:'Customer-owned',region:'CA',current:2,lat:33.9350,lng:-117.2950,

};
/* Most "no assigned yard" trailers are genuinely unresolved (no ping — no

   not being anywhere near a yard/pool — those two carry their own lat/lng

 GPSUNKNOWN={id:'__unknown__',name:'Unknown location',account:null,current:4,

  ]};
 /* Standalone — archived trailers are pulled from active pool inventory, so

/* ---------- helpers ---------- */
/* How many of the EOD projection will actually be empty (real available
   capacity) vs loaded. On-site trailers are all counted as empty (this
   file no longer tracks a per-unit loaded flag for them — see the map
   "loaded" cleanup); the only loaded portion of the projection comes from
   inbound en-route trailers flagged loaded. Rough first pass, not a real
   feed. */
/* Illustrative only — per the 8/12 jam, dispatch doesn't yet have real
   load-assignment data tying a trailer to whether it's loaded or empty
   (Thomas: "they currently lack the necessary context regarding which
   loads are assigned to which trailers"). Deterministic hash stands in
   until that feed exists, skewed toward empty since trailers idling at a
   yard waiting for their next load are the common case. */
function pseudoLoaded(tid){
 let h=0;
 for(let i=0;i<tid.length;i++)h=(h*23+tid.charCodeAt(i))>>>0;
 return h%3===0;
}
function loadedEmptyHTML(l){
 if(!l.trailers||!l.trailers.length)return '—';
 const loaded=l.trailers.filter(t=>pseudoLoaded(t.tid)).length;
 return '<b>'+loaded+'</b> loaded, <b>'+(l.trailers.length-loaded)+'</b> empty';
}
/* "Low" logic is a rough first pass, not final: currently just "exactly one
   trailer short of target" (closer to on-target than a real shortfall) —
   revisit once there's real guidance on what "approaching target" should
   mean (a percentage? a trend over time?). */
/* Parameterized so a projected/planned count can be graded against target
   the exact same way Current is — one rule, no risk of the two drifting. */
function deriveHealthForCount(l,count){
 if(typeof l.target!=='number')return 'No target set';
 if(count===0)return 'Critical';
 if(count<l.target){
  if(l.target-count===1)return 'Low';
  return 'Below target';
 }
 if(count>l.target)return 'Over target';
 return 'On target';
}
function deriveHealth(l){
 return deriveHealthForCount(l,l.current);
}
/* deriveHealth() returns strings like "No target set" — normalize its class distinctly. */
function healthClass(h){
 if(h==='No target set')return 'p-notarget';
 return 'p-'+h.toLowerCase().replace(/\s+/g,'');
}
function healthPill(l){const h=deriveHealth(l);return '<span class="pill '+healthClass(h)+'">'+h+'</span>';}
function allEntries(){return {...POOL,...OTHER,[GPSUNKNOWN.id]:GPSUNKNOWN};}

/* ---------- map (Leaflet + Esri World Topo tiles — terrain look, no API key) ---------- */
let MAP=null,MARKERS={},TRAILER_MARKERS={},LOT_RECTS={},AUTOZOOM=true;
/* Zoom level at which a location's aggregate pin gives way to individual
   per-trailer markers. Below this, one pin per location; at/above it, each
   trailer at that location gets its own marker laid out in the yard. Needs to
   be a close, street-level zoom — a yard's trailer spacing is only ~80-100m,
   which is illegibly cramped at anything wider. */
const EXPAND_ZOOM=15;
const CLICK_EXPAND_ZOOM=17;

function initMap(){
 MAP=L.map('mapEl',{scrollWheelZoom:true,zoomControl:false,fadeAnimation:false}).setView([34.6,-118.2],7);
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:19,attribution:'Tiles &copy; Esri — Esri, HERE, Garmin, USGS, NGA, EPA, NPS'
 }).addTo(MAP);
 L.control.zoom({position:'topright'}).addTo(MAP);
 L.control.scale({imperial:false,position:'bottomleft'}).addTo(MAP);
 MAP.on('zoomend',()=>renderMap());
 MAP.on('movestart',()=>unpinTrailerTooltip());
 MAP.on('click',()=>unpinTrailerTooltip());
}
function toggleAutoZoom(){
 AUTOZOOM=!AUTOZOOM;
 $('autozoomCard').classList.toggle('on',AUTOZOOM);
 if(AUTOZOOM)fitAllMarkers();
}

/* ---------- map/table split resizer ---------- */
let RESIZING=false,RESIZE_START_X=0,RESIZE_START_W=0;
function startResize(e){
 RESIZING=true;
 RESIZE_START_X=e.clientX;
 RESIZE_START_W=$('mapcol').getBoundingClientRect().width;
 $('resizer').classList.add('dragging');
 document.body.style.cursor='col-resize';
 document.body.style.userSelect='none';
 document.addEventListener('mousemove',onResizeMove);
 document.addEventListener('mouseup',stopResize);
 e.preventDefault();
}
function onResizeMove(e){
 if(!RESIZING)return;
 const contentW=$('content').getBoundingClientRect().width;
 const resizerW=$('resizer').getBoundingClientRect().width;
 const minMap=220,minTable=480;
 let newW=RESIZE_START_W+(e.clientX-RESIZE_START_X);
 newW=Math.max(minMap,Math.min(newW,contentW-resizerW-minTable));
 $('mapcol').style.flex='0 0 '+newW+'px';
 if(MAP)MAP.invalidateSize();
}
function stopResize(){
 RESIZING=false;
 $('resizer').classList.remove('dragging');
 document.body.style.cursor='';
 document.body.style.userSelect='';
 document.removeEventListener('mousemove',onResizeMove);
 document.removeEventListener('mouseup',stopResize);
}
function fitAllMarkers(){
 const pts=Object.values({...POOL,...OTHER}).map(l=>[l.lat,l.lng])
  .concat(GPSUNKNOWN.trailers.filter(t=>t.lat!=null).map(t=>[t.lat,t.lng]));
 if(pts.length)MAP.fitBounds(pts,{padding:[48,48],maxZoom:13});
}
/* A search query that resolves to one or more specific locations (by name,
   account, or a trailer id living there) should zoom the map to just those
   locations, rather than leaving the full fitAllMarkers view — the map
   should follow what the search actually found. GPS/Unknown has no
   resolved coordinates, so it's naturally skipped here. */
function zoomToSearchMatches(matched){
 const pts=[];
 matched.forEach(l=>{
  if(l.lat!=null){pts.push([l.lat,l.lng]);return;}
  /* No single group point (e.g. "Unknown location") — fall back to
     whichever of its trailers has its own resolved coordinates AND is
     actually what the search matched, rather than zooming to nothing. */
  (l.trailers||[]).forEach(t=>{
   if(t.lat!=null&&(t.tid.toLowerCase().includes(SEARCHTEXT)||(t.loc&&t.loc.toLowerCase().includes(SEARCHTEXT))))pts.push([t.lat,t.lng]);
  });
 });
 if(!pts.length)return;
 if(pts.length===1)MAP.flyTo(pts[0],15,{duration:0.6});
 else MAP.fitBounds(pts,{padding:[48,48],maxZoom:14});
}
/* Trailers at one yard don't have independent real coordinates, so lay them
   out like a small parking lot — tight rows/columns around the yard's point,
   the way trailers actually sit in a staging lot — rather than a loose ring. */
const LOT_ROW_SPACING=0.0009;
function lotGrid(lat,lng,n){
 const cols=Math.ceil(Math.sqrt(n));
 const rows=Math.ceil(n/cols);
 const spLat=LOT_ROW_SPACING, spLng=LOT_ROW_SPACING/Math.cos(lat*Math.PI/180);
 const pts=[];
 for(let i=0;i<n;i++){
  const col=i%cols, row=Math.floor(i/cols);
  pts.push([lat+(row-(rows-1)/2)*spLat, lng+(col-(cols-1)/2)*spLng]);
 }
 return{pts,cols,rows,spLat,spLng};
}
/* Trailer card overlay content — health (DVIR, per dispatch-playbook's
   pre/post-trip inspection) and PM-due (maintenance flags → Ryder, per the
   TX journey). Loaded/empty isn't shown on the map anymore — a "last load"
   reference already lives in the tables (All Trailers, expanded location),
   and duplicating it here as a status row implied something the map
   couldn't actually back up (a live loaded/empty feed). Trailers default to
   DVIR-passed/not-due unless the seed data flags otherwise. */
const DVIR_TIP='Driver Vehicle Inspection Report missing';
const LOADEDEMPTY_TIP='How many of the trailers currently on site are loaded vs empty — illustrative for now, not backed by real load-assignment data yet.';
/* Single source of truth for the DVIR/PM-due/AMZN-hold flag badges — reused
   by the map card, the expanded location's trailers table, and the All
   Trailers list, so a trailer reads the same everywhere instead of drifting
   (e.g. an Amazon-held trailer showing generic "PM due" on the map card but
   "AMZN hold" in the tables). useTitle picks the tooltip mechanism: native
   title (map card, already inside a Leaflet tooltip) vs the shared
   showTip/hideTip hovertip (tables). */
function flagBadgeHTML(cls,color,icon,label,tip,useTitle){
 const inner=(color?'<span style="color:'+color+';display:inline-flex">'+icon+'</span>':icon)+label;
 return useTitle
  ? '<span class="'+cls+'" title="'+esc(tip)+'">'+inner+'</span>'
  : '<span class="'+cls+'" onmouseenter="showTip(this,\''+tip.replace(/'/g,"\\'")+'\')" onmouseleave="hideTip()">'+inner+'</span>';
}
function dvirBadgeHTML(t,useTitle){
 return t.dvir==='flagged'?flagBadgeHTML('pmflag','var(--red)',ICON.flag,'DVIR',DVIR_TIP,useTitle):'';
}
function maintBadgeHTML(t,needsMaint,useTitle){
 if(needsMaint)return flagBadgeHTML('pmflag','var(--amber)',ICON.flag,'AMZN hold','Amazon-flagged — needs maintenance before its next dispatch',useTitle);
 if(t.pmDue)return flagBadgeHTML('pmcallout',null,ICON.pmAlert,'PM due','Due for preventative maintenance — was due '+pseudoScheduledPM(t).text,useTitle);
 return '';
}
function trailerCardHTML(t,needsMaint){
 const dvir=dvirBadgeHTML(t,true);
 const maint=maintBadgeHTML(t,needsMaint,true);
 const hasStatus=!!dvir||!!maint;
 return '<div class="trailercard">'+
  '<div class="tc-id">'+esc(t.tid)+'</div>'+
  '<div class="tc-row">'+(t.source==='gps'?'GPS':'Manual')+' · '+esc(t.lastPing)+'</div>'+
  (hasStatus?'<div class="tc-status">'+
   (dvir?'<div class="tc-row">'+dvir+'</div>':'')+
   (maint?'<div class="tc-row">'+maint+'</div>':'')+
  '</div>':'')+
  '</div>';
}
function renderMap(){
 Object.values(MARKERS).forEach(m=>MAP.removeLayer(m));
 Object.values(TRAILER_MARKERS).flat().forEach(m=>MAP.removeLayer(m));
 Object.values(LOT_RECTS).forEach(r=>MAP.removeLayer(r));
 MARKERS={};TRAILER_MARKERS={};LOT_RECTS={};
 PINNED_TRAILER=null;
 const expanded=MAP.getZoom()>=EXPAND_ZOOM;
 Object.values({...POOL,...OTHER}).forEach(l=>{
  const h=deriveHealth(l);
  if(expanded&&l.trailers.length>0){
   const{pts,cols,rows,spLat,spLng}=lotGrid(l.lat,l.lng,l.trailers.length);
   const padLat=spLat*0.65, padLng=spLng*0.65;
   const halfLat=((rows-1)/2)*spLat+padLat, halfLng=((cols-1)/2)*spLng+padLng;
   LOT_RECTS[l.id]=L.rectangle(
    [[l.lat-halfLat,l.lng-halfLng],[l.lat+halfLat,l.lng+halfLng]],
    {fillColor:'#E9EDF2',fillOpacity:.55,color:'#B9C4D0',weight:1,dashArray:'3,3',interactive:false}
   ).addTo(MAP);
   TRAILER_MARKERS[l.id]=l.trailers.map((t,i)=>{
    const[lat,lng]=pts[i];
    const dotClass='trailerdot td-'+t.source+(t.pmDue?' pmdue':'');
    const icon=L.divIcon({className:'',html:'<div class="'+dotClass+'">'+ICON.trailerbox+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
    const marker=L.marker([lat,lng],{icon}).addTo(MAP);
    marker._tid=t.tid;
    marker._cardHTML=trailerCardHTML(t,needsAmznHold({t,account:l.account}));
    marker.bindTooltip(marker._cardHTML,{direction:'top',offset:[0,-14],className:'poolTip trailercard',interactive:true});
    marker.on('click',(e)=>{
     L.DomEvent.stopPropagation(e);
     flashTableRow(l.id);
     pinTrailerTooltip(marker);
    });
    return marker;
   });
  } else {
   const icon=L.divIcon({className:'',html:'<div class="pin '+healthClass(h)+'">'+(l.current>1?'<span class="pn">'+l.current+'</span>':'')+'</div>',iconSize:[20,20],iconAnchor:[10,20]});
   const marker=L.marker([l.lat,l.lng],{icon}).addTo(MAP);
   marker.bindTooltip(esc(l.name)+' · '+l.current,{direction:'top',offset:[0,-18],className:'poolTip'});
   marker.on('click',()=>{MAP.setView([l.lat,l.lng],CLICK_EXPAND_ZOOM);highlightRow(l.id);});
   MARKERS[l.id]=marker;
  }
 });
 /* "Unknown location" has no single group point to plot or lot-grid around —
    it's a catch-all, not a yard. But individual trailers inside it can still
    carry their own resolved lat/lng (a GPS fix that just isn't near any
    yard), so plot those directly at their real coordinates. */
 TRAILER_MARKERS[GPSUNKNOWN.id]=GPSUNKNOWN.trailers.filter(t=>t.lat!=null).map(t=>{
  const dotClass='trailerdot td-'+t.source+(t.pmDue?' pmdue':'');
  const icon=L.divIcon({className:'',html:'<div class="'+dotClass+'">'+ICON.trailerbox+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
  const marker=L.marker([t.lat,t.lng],{icon}).addTo(MAP);
  marker._tid=t.tid;
  marker._cardHTML=trailerCardHTML(t,needsAmznHold({t,account:GPSUNKNOWN.account}));
  marker.bindTooltip(marker._cardHTML,{direction:'top',offset:[0,-14],className:'poolTip trailercard',interactive:true});
  marker.on('click',(e)=>{
   L.DomEvent.stopPropagation(e);
   flashTableRow(GPSUNKNOWN.id);
   pinTrailerTooltip(marker);
  });
  return marker;
 });
}
function flashPin(id){
 const l=allEntries()[id];
 if(!l||l.lat==null)return;
 MAP.panTo([l.lat,l.lng],{animate:true});
 const marker=MARKERS[id];
 if(marker){
  marker.openTooltip();
  const el=marker.getElement();const pinEl=el&&el.querySelector('.pin');
  if(pinEl){pinEl.classList.add('flash');setTimeout(()=>pinEl.classList.remove('flash'),1800);}
  setTimeout(()=>marker.closeTooltip(),1800);
  return;
 }
 (TRAILER_MARKERS[id]||[]).forEach(m=>{
  const el=m.getElement();const dot=el&&el.querySelector('.trailerdot');
  if(dot){dot.classList.add('flash');setTimeout(()=>dot.classList.remove('flash'),1800);}
 });
}
function flashTableRow(id){
 const row=document.querySelector('.poolrow[data-id="'+id+'"]');
 if(row){row.scrollIntoView({block:'nearest',behavior:'smooth'});row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),1400);}
}
function highlightRow(id){
 flashTableRow(id);
 flashPin(id);
}
/* Click-to-pin trailer card: stays open (ignores mouseout) until the map is
   panned/zoomed or the user clicks elsewhere on the map.
   Leaflet only wires up its mouseover/mouseout auto show/hide listeners once,
   at bindTooltip() time, based on the permanent option at THAT moment —
   flipping tooltip.options.permanent afterward doesn't remove them, so the
   old hover-close listener was still firing on mouseout and closing the
   "pinned" tooltip. Rebinding the tooltip fresh with permanent:true/false
   re-runs that wiring so pin/unpin actually takes effect. */
let PINNED_TRAILER=null;
function pinTrailerTooltip(marker){
 unpinTrailerTooltip();
 if(marker._cardHTML){
  marker.unbindTooltip();
  marker.bindTooltip(marker._cardHTML,{direction:'top',offset:[0,-14],className:'poolTip trailercard',interactive:true,permanent:true});
 }
 marker.openTooltip();
 PINNED_TRAILER=marker;
}
function unpinTrailerTooltip(){
 if(!PINNED_TRAILER)return;
 if(PINNED_TRAILER._cardHTML){
  PINNED_TRAILER.unbindTooltip();
  PINNED_TRAILER.bindTooltip(PINNED_TRAILER._cardHTML,{direction:'top',offset:[0,-14],className:'poolTip trailercard',interactive:true});
 } else {
  PINNED_TRAILER.closeTooltip();
 }
 PINNED_TRAILER=null;
}
/* Selecting a trailer from the All Trailers list (or anywhere else, later)
   zooms the map into its yard and pins that trailer's own card overlay —
   the same thing clicking its marker directly does. No drawer.
   TODO: once a trailer-detail view exists, this should navigate there instead. */
function selectTrailerFromList(tid,locId){
 const loc=allEntries()[locId];
 if(!loc){toast(tid+' has no resolved map location.');return;}
 /* Groups like "Unknown location" have no single point of their own, but a
    specific trailer inside can still carry its own resolved lat/lng. */
 const t=(loc.trailers||[]).find(x=>x.tid===tid);
 const viewPoint=loc.lat!=null?[loc.lat,loc.lng]:(t&&t.lat!=null?[t.lat,t.lng]:null);
 if(!viewPoint){toast(tid+' has no resolved map location.');return;}
 MAP.setView(viewPoint,CLICK_EXPAND_ZOOM);
 const marker=(TRAILER_MARKERS[locId]||[]).find(m=>m._tid===tid);
 if(marker){pinTrailerTooltip(marker);}
 else{
  const enRouteEntry=(loc.enRoute||[]).find(e=>e.tid===tid);
  if(enRouteEntry)toast(tid+' is en route to '+loc.name+' — ETA '+enRouteEntry.eta+'.');
  else toast(tid+' is archived — not currently shown on the map.');
 }
}

/* ---------- list ---------- */
let CHIPFILTER='all',EXPANDEDROWS={};
function chipCounts(){const vals=Object.values(POOL);
 return{all:vals.length,ontarget:vals.filter(l=>deriveHealth(l)==='On target').length,
  low:vals.filter(l=>deriveHealth(l)==='Low').length,
  belowtarget:vals.filter(l=>deriveHealth(l)==='Below target').length,
  overtarget:vals.filter(l=>deriveHealth(l)==='Over target').length,
  critical:vals.filter(l=>deriveHealth(l)==='Critical').length};}
function renderChips(){const c=chipCounts();
 const defs=[['all','All pools',c.all],['ontarget','On target',c.ontarget],['low','Low',c.low],['belowtarget','Below target',c.belowtarget],['overtarget','Over target',c.overtarget],['critical','Critical',c.critical]];
 $('poolchips').innerHTML=defs.map(d=>'<div class="chip'+(CHIPFILTER===d[0]?' on':'')+'" onclick="CHIPFILTER=\''+d[0]+'\';renderList()">'+d[1]+' '+d[2]+'</div>').join('');}
let SEARCHTEXT='';
function matchesSearch(l){
 if(!SEARCHTEXT)return true;
 if(l.name&&l.name.toLowerCase().includes(SEARCHTEXT))return true;
 if(l.account&&l.account.toLowerCase().includes(SEARCHTEXT))return true;
 return!!(l.trailers&&l.trailers.some(t=>t.tid.toLowerCase().includes(SEARCHTEXT)||(t.loc&&t.loc.toLowerCase().includes(SEARCHTEXT))));
}
function setSearchText(v){SEARCHTEXT=v.trim().toLowerCase();renderList();}
/* Locations/trailers without a resolved region (GPS/Unknown, archived
   look-up misses) always pass — filtering them out would just hide real
   assets we genuinely can't place yet. */
function matchesRegion(l){return REGIONFILTER==='all'||!l.region||l.region===REGIONFILTER;}
function passFilter(l){
 if(CHIPFILTER!=='all'){const h=deriveHealth(l).toLowerCase().replace(/\s+/g,'');if(h!==CHIPFILTER)return false;}
 if(!matchesRegion(l))return false;
 return matchesSearch(l);
}
/* While a search is active, a matched row should show itself open with
   only the trailer(s) that actually matched — not force the user to click
   in, then still have to scan past everything that didn't match. If the
   query matched the location itself (name/account) every trailer there is
   still relevant, so show them all. */
function visibleTrailers(l){
 if(!SEARCHTEXT)return l.trailers;
 const groupMatches=(l.name&&l.name.toLowerCase().includes(SEARCHTEXT))||(l.account&&l.account.toLowerCase().includes(SEARCHTEXT));
 if(groupMatches)return l.trailers;
 return l.trailers.filter(t=>t.tid.toLowerCase().includes(SEARCHTEXT)||(t.loc&&t.loc.toLowerCase().includes(SEARCHTEXT)));
}
function rowHTML(id,l){const h=deriveHealth(l);const hasTarget=typeof l.target==='number';const expanded=!!EXPANDEDROWS[id]||!!SEARCHTEXT;
 let out='<div class="poolrow'+(expanded?' expanded':'')+'" data-id="'+id+'" onclick="toggleRowExpand(\''+id+'\')">'+
 '<div class="loc"><span class="name">'+esc(l.name)+'</span>'+(l.account?'<span class="acct">'+esc(l.account)+'</span>':'')+'</div>'+
 '<div>'+healthPill(l)+'</div>'+
 '<div class="count"><div class="cnums"><b>'+l.current+'</b>'+balanceDeficitHTML(l,l.current)+'</div></div>'+
 '<div class="loadedempty">'+loadedEmptyHTML(l)+'</div>'+
 '<div class="target">'+(hasTarget?l.target:'—')+(hasTarget?'<span class="targetedit" onclick="event.stopPropagation();openEditTargetModal(\''+id+'\')" title="Edit target">'+ICON.pencil+'</span>':'')+'</div>'+
 '<div class="chev2">'+ICON.chevronRight+'</div></div>';
 if(expanded)out+=rowExpandHTML(l);
 return out;}
function colHead(){return '<div class="colhead"><div>Trailer pool</div><div>Health</div><div>Current</div><div title="'+LOADEDEMPTY_TIP+'">Loaded/Empty <span class="infoq">ⓘ</span></div><div>Target</div><div></div></div>';}
function renderList(){renderChips();
 const poolIds=Object.keys(POOL).filter(id=>passFilter(POOL[id]));
 const poolRows=poolIds.map(id=>[id,POOL[id]]);
 const otherRows=Object.keys(OTHER).map(id=>[id,OTHER[id]]).filter(([id,l])=>matchesRegion(l)&&matchesSearch(l));
 const unknownRows=(GPSUNKNOWN.current>0&&matchesSearch(GPSUNKNOWN))?[[GPSUNKNOWN.id,GPSUNKNOWN]]:[];
 const body=[...poolRows,...otherRows,...unknownRows].map(([id,l])=>rowHTML(id,l)).join('');
 $('listwrap').innerHTML=colHead()+body;
 renderMap();
 if(SEARCHTEXT)zoomToSearchMatches([...poolRows,...otherRows,...unknownRows].map(([id,l])=>l));
 else if(AUTOZOOM)fitAllMarkers();
 renderAllTrailers();
}

/* Deterministic pseudo-day-count from a trailer id — illustrative only, this
   prototype has no real "arrived at location" timestamp to compute from. */
function pseudoDays(tid){
 let h=0;
 for(let i=0;i<tid.length;i++)h=(h*31+tid.charCodeAt(i))>>>0;
 return h%6;
}
/* Calendar-date formatter shared by the last-serviced/scheduled-PM helpers
   below — "Aug 12, 2026", not a relative "N days ago"/"in N days" string. */
function fmtDate(d){
 return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
/* Illustrative arrived-at-location date+time — reuses pseudoDays() (the same
   "N days at location" figure shown in the All Trailers list) for the day
   offset, so both views agree on how long a trailer's been sitting there,
   plus a pseudo time-of-day for the "arrived at" instant. */
function pseudoArrivedAt(t){
 const daysAgo=pseudoDays(t.tid);
 let h=0;
 for(let i=0;i<t.tid.length;i++)h=(h*13+t.tid.charCodeAt(i))>>>0;
 const d=new Date();
 d.setDate(d.getDate()-daysAgo);
 d.setHours(6+(h%12),(h*7)%60,0,0);
 return fmtDate(d)+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
/* Illustrative arrived-from origin — same pool of location names used as
   en-route "From" values elsewhere, minus the trailer's current location
   (arriving "from" where it already sits isn't a sensible origin). */
const ARRIVED_FROM_POOL=['Perris Ranch, CA','TSG Fontana, CA','Amazon LGB3 – Redlands, CA','Amazon LGB5 – Moreno Valley, CA','Amazon LGB7 – Eastvale, CA','Amazon BFL1 – Bakersfield, CA','P&G – Moreno Valley, CA'];
function pseudoArrivedFrom(t,currentName){
 let h=0;
 for(let i=0;i<t.tid.length;i++)h=(h*11+t.tid.charCodeAt(i))>>>0;
 const pool=ARRIVED_FROM_POOL.filter(n=>n!==currentName);
 return pool[h%pool.length];
}
/* Illustrative next-scheduled-PM date — PM-due trailers land overdue (past
   due date, flagged amber); everything else lands somewhere in the normal
   maintenance-interval future. Same deterministic-hash approach as the other
   pseudo-* helpers, just walked forward instead of back. */
function pseudoScheduledPM(t){
 let h=0;
 for(let i=0;i<t.tid.length;i++)h=(h*29+t.tid.charCodeAt(i))>>>0;
 const d=new Date();
 if(t.pmDue){
  const days=(h%20)+1;
  d.setDate(d.getDate()-days);
  return{text:fmtDate(d),overdue:true};
 }
 const days=(h%75)+15;
 d.setDate(d.getDate()+days);
 return{text:fmtDate(d),overdue:false};
}
/* Illustrative last-assigned-load id, same 4-digit Apollo Load ID convention
   used across this workspace's other demo data (the 76xx load roster). */
function pseudoLoadId(tid){
 let h=0;
 for(let i=0;i<tid.length;i++)h=(h*17+tid.charCodeAt(i))>>>0;
 return 7600+(h%140);
}
/* Load chip status-dot color — cycles through the real Load-chip status-dot
   tokens (shared/tokens.css) for illustrative variety, same as the reference. */
const LOAD_DOT_COLORS=['var(--icon-violet-dispatched)','var(--icon-stone-cancelled)','var(--icon-blue-in-progress)','var(--icon-emerald-success)','var(--icon-fuschia-pending)'];
function pseudoLoadColor(loadId){
 return LOAD_DOT_COLORS[loadId%LOAD_DOT_COLORS.length];
}
/* Same GPS/Manual · last-ping callout the map's trailer card shows — reused
   verbatim in the All Trailers list and the expanded location's trailers
   table so tracking-method context isn't map-only. Transit (en-route)
   entries don't carry source/lastPing, hence the fallback. */
function sourcePingHTML(t){
 if(!t.source)return '—';
 return (t.source==='gps'?'GPS':'Manual')+' · '+esc(t.lastPing);
}
/* Shared Load chip markup — used wherever a trailer's current/last load needs
   calling out (All Trailers list, drawer trailers table, map card). */
function loadPillHTML(tid){
 const loadId=pseudoLoadId(tid);
 return '<span class="loadtag"><span class="dot" style="background:'+pseudoLoadColor(loadId)+'"></span>Load '+loadId+'</span>';
}
/* A planned hook/drop's load ref: hashed from its trailer id when there is
   one (loadPillHTML), so it matches that trailer's "Last Load" everywhere
   else it shows up — falling back to a hand-set override for the rarer
   case where dispatch already knows the load but not yet which physical
   trailer will cover it. */
/* Only worth a callout once the projected balance itself would read Low
   or worse against target — Over target/On target/No target set stay
   silent, same severities deriveHealth already uses for Current. Whenever
   it does show, the pill also states the actual deficit (target minus
   that balance) rather than making the reader do that subtraction. */
function balanceDeficitHTML(l,count){
 if(typeof l.target!=='number'||count>=l.target)return '';
 return '<span class="underdeficit">(Under target <span class="unum">-'+(l.target-count)+'</span>)</span>';

function eventLoadHTML(ev){
 if(ev.tid)return loadPillHTML(ev.tid);

}
/* Planned is seeded soonest-first with just a type (hook/drop) — balance is
   derived, not hand-typed, so it can't drift out of sync with Current.
   Current is where the count sits right now, before any of these have
   happened yet; each entry projects one step forward from there. */
function plannedWithBalance(l){
 const evs=l.planned||[];
 let bal=l.current;
 return evs.map(e=>{
  bal=(e.type==='drop')?bal+1:bal-1;
  return {...e,balance:bal};
 });
}
/* Real TrailerType values from the apollo app's trailer filter panel. Most
   seeded trailers don't carry an explicit type, so we skew a deterministic
   pseudo-type toward Dry Box (typical for a general-freight/Amazon relay
   pool) with a handful of others for the filter to have something to do. */
const TRAILER_TYPES=['Dry Box','Reefer','Flatbed','Step Deck','Tanker','Low Boy','Intermodal Chassis','Auto Hauler','Livestock','Dump Tipper','Curtain Side','Stake','Construction','Other'];

const TRAILER_LENGTHS=["28'","40'","45'","48'","53'"];

 if(t.type)return t.type;
 let h=0;
 for(let i=0;i<t.tid.length;i++)h=(h*13+t.tid.charCodeAt(i))>>>0;
 const r=h%10;
 if(r<7)return 'Dry Box';
 if(r===7)return 'Reefer';
 if(r===8)return 'Flatbed';
 return 'Curtain Side';

/* Looks up the live trailer object by tid across every place one can live —
   pool/other locations, their en-route lists, GPS/Unknown, and archived —

function trailerByTid(tid){
 for(const l of [...Object.values(POOL),...Object.values(OTHER)]){

  if(enFound)return enFound;
 }

function allTrailerRows(includeArchived){
 const rows=[];
 Object.values(POOL).forEach(l=>{

 });
 Object.values(OTHER).forEach(l=>l.trailers.forEach(t=>rows.push({t,locId:l.id,locName:l.name,region:l.region,account:l.account,isPool:false,archived:false})));
 GPSUNKNOWN.trailers.forEach(t=>rows.push({t,locId:GPSUNKNOWN.id,locName:'Unknown location',region:null,account:null,isPool:false,archived:false}));
 if(includeArchived){
  ARCHIVED_TRAILERS.forEach(t=>{
   const loc=POOL[t.locId]||OTHER[t.locId];
   rows.push({t,locId:t.locId,locName:t.locName,region:loc&&loc.region,account:loc&&loc.account,isPool:!!POOL[t.locId],archived:true});

/* Full per-trailer status vocabulary: Available / At Load Delivery / At
   Load Pickup / Unknown / At Hub Stop / In Transit - Loaded / In Transit -

   state, so it isn't one of the seven). Precedence, highest first:
   archived > in-transit > AMZN-held (can't be trusted as Available even
   though we know exactly where it's sitting) > genuinely unknown location
   > location-type. */
function deriveTrailerStatus(r,needsMaint){
 if(r.archived)return{key:'archived',label:'Archived',cls:'p-notarget'};
 if(r.transit)return r.t.loaded?{key:'transitloaded',label:'In Transit - Loaded',cls:'p-transit'}:{key:'transitempty',label:'In Transit - Empty',cls:'p-transitempty'};
 if(needsMaint)return{key:'unknown',label:'Unknown',cls:'p-unknown'};
 if(r.locId===GPSUNKNOWN.id)return{key:'unknown',label:'Unknown',cls:'p-unknown'};
 if(r.account==='Nevoya Fleet Yard')return{key:'athubstop',label:'At Hub Stop',cls:'p-hubstop'};
 if(r.account==='Amazon Relay')return{key:'available',label:'Available',cls:'p-available'};
 if(r.isPool)return{key:'atpickup',label:'At Load Pickup',cls:'p-pickup'};
 return{key:'atdelivery',label:'At Load Delivery',cls:'p-delivery'};

/* "AMZN hold" is an Amazon-defined attribute with no real feed yet — true

   sitting at a Nevoya yard or a customer dock. A held trailer's Status
   reads Unknown rather than Available: we know where it's parked, but not
   whether Amazon will actually accept it back into service. */
function needsAmznHold(r){return !!r.t.amznHold||(!!r.t.pmDue&&r.account==='Amazon Relay');}

 });

 const locs=[...Object.values(POOL),...Object.values(OTHER)];
 const locOptions=locs.map(l=>'<option value="'+l.id+'">'+esc(l.name)+'</option>').join('');
 $('modalbox').innerHTML=dlgHead('Create trailer')+
  '<div class="dbd">'+
   '<div class="ffield"><label>Trailer ID *</label><input type="text" id="in_newtid" placeholder="e.g. NEVO-5001"><div class="hint">Matches the unit ID on the trailer\'s GPS tag or manual log entry.</div></div>'+
   '<div class="ffield"><label>Trailer type</label><select id="in_newtype">'+TRAILER_TYPES.map(ty=>'<option>'+esc(ty)+'</option>').join('')+'</select></div>'+
   '<div class="ffield"><label>Location *</label><select id="in_newloc">'+locOptions+'</select></div>'+
   '<div class="ffield"><label>Source</label><select id="in_newsource"><option value="gps">GPS</option><option value="manual">Manual</option></select><div class="hint">Manual means no live GPS feed — tracked by hand, like a rental.</div></div>'+
  '</div>'+
  '<div class="dft"><div class="grp"><button class="abtn" onclick="closeModal()">Cancel</button><button class="abtn primary" onclick="submitCreateTrailer()">Create trailer</button></div></div>';
 openModal();
}
function submitCreateTrailer(){
 const tid=$('in_newtid').value.trim();
 const type=$('in_newtype').value;
 const locId=$('in_newloc').value;
 const source=$('in_newsource').value;
 if(!tid){toast('Enter a trailer ID.');return;}
 const loc=POOL[locId]||OTHER[locId];
 if(!loc){toast('Choose a location.');return;}
 loc.trailers.push({tid,source,type,lastPing:'just added'});
 loc.current+=1;
 closeModal();
 renderList();
 toast('Trailer '+tid+' created at '+loc.name+'.');
}

/* ---------- edit trailer modal — the pencil on each All Trailers row.
   Field set matches the real Apollo Edit Trailer form (registration/plate/
   make-model-year, trailer details, axle & weight, financial, notes) —
   Location and Source are additions of ours (this prototype's own
   pool-membership concept, not in that reference) kept alongside it since
   they're already functional. Most of these fields have no seed data behind
   them yet, so they render empty/placeholder like an incomplete real record
   would, rather than inventing fake VINs/makes/models to fill them. Location
   move only offered when the trailer currently sits in a POOL/OTHER
   location's trailers[] — GPS/Unknown and en-route rows don't have a simple
   single-array move to make. ---------- */
function openEditTrailerModal(tid,locId){
 const t=trailerByTid(tid);
 if(!t)return;
 const loc=POOL[locId]||OTHER[locId];
 const locs=[...Object.values(POOL),...Object.values(OTHER)];
 const locOptions=locs.map(l=>'<option value="'+l.id+'"'+(l.id===locId?' selected':'')+'>'+esc(l.name)+'</option>').join('');
 const v=k=>esc(t[k]==null?'':t[k]);
 $('modalbox').innerHTML=dlgHead('Edit trailer — '+esc(tid))+
  '<div class="dbd">'+
   '<div class="fsect">Trailer Registration Details</div>'+
   '<div class="ffield"><label>Trailer Name *</label><input type="text" id="m_edittid" value="'+v('tid')+'"></div>'+
   '<div class="ffield"><label>VIN *</label><input type="text" id="m_editvin" value="'+v('vin')+'" placeholder="1UYVS2530L3090513"></div>'+
   '<div class="ffieldrow">'+
    '<div class="ffield"><label>License Plate Number *</label><input type="text" id="m_editplate" value="'+v('plateNumber')+'"></div>'+
    '<div class="ffield"><label>License Plate State *</label><select id="m_editplatestate"><option value="">Select</option>'+US_STATES.map(s=>'<option'+(t.plateState===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>'+
   '</div>'+
   '<div class="ffieldrow">'+
    '<div class="ffield"><label>Make *</label><input type="text" id="m_editmake" value="'+v('make')+'" placeholder="Utility Trailer Manufacturer"></div>'+
    '<div class="ffield"><label>Model *</label><input type="text" id="m_editmodel" value="'+v('model')+'" placeholder="Utility Trailer Manufacturer"></div>'+
   '</div>'+
   '<div class="ffieldrow">'+
    '<div class="ffield"><label>Year *</label><input type="number" id="m_edityear" value="'+v('year')+'" placeholder="2020"></div>'+
    '<div class="ffield"><label>Trailer Weight (lbs) *</label><input type="number" id="m_editweight" value="'+v('weightLbs')+'"></div>'+
   '</div>'+
   '<div class="fsect">Trailer Details</div>'+
   '<div class="ffield"><label>Trailer Type *</label><select id="m_edittype">'+TRAILER_TYPES.map(ty=>'<option'+(ty===pseudoType(t)?' selected':'')+'>'+esc(ty)+'</option>').join('')+'</select></div>'+
   '<div class="ffieldrow">'+
    '<div class="ffield"><label>Region</label><select id="m_editregion"><option value="">Select Region</option><option value="AZ"'+(t.region==='AZ'?' selected':'')+'>Arizona</option><option value="CA"'+(t.region==='CA'?' selected':'')+'>California</option><option value="TX"'+(t.region==='TX'?' selected':'')+'>Texas</option></select></div>'+
    '<div class="ffield"><label>Length</label><select id="m_editlength"><option value="">Select</option>'+TRAILER_LENGTHS.map(l=>'<option'+(t.length===l?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
   '</div>'+
   '<div class="fsect">Location &amp; Tracking</div>'+
   (loc?'<div class="ffield"><label>Location</label><select id="m_editloc">'+locOptions+'</select></div>':'')+
   '<div class="ffield"><label>Source</label><select id="m_editsource"><option value="gps"'+(t.source==='gps'?' selected':'')+'>GPS</option><option value="manual"'+(t.source==='manual'?' selected':'')+'>Manual</option></select><div class="hint">Manual means no live GPS feed — tracked by hand, like a rental.</div></div>'+
   '<div class="fsect">Axle &amp; Weight</div>'+
   '<div class="ffieldrow">'+
    '<div class="ffield"><label>Axle</label><input type="number" id="m_editaxle" value="'+v('axleCount')+'"></div>'+
    '<div class="ffield"><label>Gross Vehicle Weight Rating</label><input type="text" id="m_editgvwr" value="'+v('gvwr')+'" placeholder="Enter Gross Vehicle Weight Rating"></div>'+
   '</div>'+
   '<div class="ffield"><label>Gross Axle Weight Rating</label><input type="text" id="m_editgawr" value="'+v('gawr')+'" placeholder="Enter Gross Axle Weight Rating"></div>'+
   '<div class="fsect">Financial Information</div>'+
   '<div class="radiorow">'+
    '<label class="radioopt"><input type="radio" name="m_editownership" value="leased"'+(t.ownership!=='owned'?' checked':'')+'>Leased</label>'+
    '<label class="radioopt"><input type="radio" name="m_editownership" value="owned"'+(t.ownership==='owned'?' checked':'')+'>Owned</label>'+
   '</div>'+
   '<div class="ffieldrow">'+
    '<div class="ffield"><label>Monthly Financial Cost</label><div class="dollarinput"><span class="dsign">$</span><input type="number" id="m_editfincost" value="'+v('monthlyFinancialCost')+'" placeholder="Enter Monthly Financial Cost"></div></div>'+
    '<div class="ffield"><label>Monthly Insurance Cost</label><div class="dollarinput"><span class="dsign">$</span><input type="number" id="m_editinscost" value="'+v('monthlyInsuranceCost')+'" placeholder="Enter Monthly Insurance Cost"></div></div>'+
   '</div>'+
   '<div class="fsect">Notes</div>'+
   '<div class="ffield"><textarea id="m_editnotes" rows="3" placeholder="Notes">'+v('notes')+'</textarea></div>'+
  '</div>'+
  '<div class="dft"><div class="grp"><button class="abtn" onclick="closeModal()">Cancel</button><button class="abtn primary" onclick="submitEditTrailer(\''+tid+'\',\''+locId+'\')">Save Changes</button></div></div>';
 openModal();
}
function submitEditTrailer(tid,oldLocId){
 const t=trailerByTid(tid);
 if(!t){closeModal();return;}
 const newTid=$('m_edittid').value.trim();
 if(!newTid){toast('Trailer name is required.');return;}
 if(newTid!==tid&&trailerByTid(newTid)){toast('A trailer named '+newTid+' already exists.');return;}
 t.tid=newTid;
 t.vin=$('m_editvin').value.trim();
 t.plateNumber=$('m_editplate').value.trim();
 t.plateState=$('m_editplatestate').value;
 t.make=$('m_editmake').value.trim();
 t.model=$('m_editmodel').value.trim();
 t.year=$('m_edityear').value?parseInt($('m_edityear').value,10):null;
 t.weightLbs=$('m_editweight').value?parseInt($('m_editweight').value,10):null;
 t.type=$('m_edittype').value;
 t.region=$('m_editregion').value||null;
 t.length=$('m_editlength').value||null;
 t.source=$('m_editsource').value;
 t.axleCount=$('m_editaxle').value?parseInt($('m_editaxle').value,10):null;
 t.gvwr=$('m_editgvwr').value.trim();
 t.gawr=$('m_editgawr').value.trim();
 const ownEl=document.querySelector('input[name="m_editownership"]:checked');
 t.ownership=ownEl?ownEl.value:'leased';
 t.monthlyFinancialCost=$('m_editfincost').value?parseFloat($('m_editfincost').value):null;
 t.monthlyInsuranceCost=$('m_editinscost').value?parseFloat($('m_editinscost').value):null;
 t.notes=$('m_editnotes').value.trim();
 const locSel=$('m_editloc');
 if(locSel&&locSel.value&&locSel.value!==oldLocId){
  const oldLoc=POOL[oldLocId]||OTHER[oldLocId];
  const newLoc=POOL[locSel.value]||OTHER[locSel.value];
  if(oldLoc){
   const idx=oldLoc.trailers.findIndex(x=>x.tid===newTid);
   if(idx>=0){oldLoc.trailers.splice(idx,1);oldLoc.current=Math.max(0,(oldLoc.current||0)-1);}
  }
  if(newLoc){newLoc.trailers.push(t);newLoc.current=(newLoc.current||0)+1;}
 }
 closeModal();
 renderList();
 toast('Trailer '+newTid+' updated.');
}

/* ---------- boot ---------- */
seedPool();
initMap();
renderTypeOptions();
renderList();
</script>
