<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#1B4E4C;--teal-soft:#DCEFE9;--ink:#0F172A;--gray:#64748B;--line:#E2E8F0;--bg:#F7F7F8;
--yellow:#F5E077;--purple:#E4DDF7;--red:#DC2626;--redsoft:#FDECEC;--orange:#E67E22;--green:#27AE60;--greensoft:#E7F6EC;--warnbg:#FCF6DE;--blue:#1D4ED8;--bluesoft:#E0EAFB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,-apple-system,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;font-size:14px}
#app{display:flex;height:100vh}
/* rail (matches mvp2-apollo.html) */
#rail{width:64px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex:none}
#rail .logo{width:34px;height:34px;border-radius:8px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-bottom:10px}
#rail .ric{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:#475569;position:relative}
#rail .ric:hover{background:#F1F5F9}
#rail .ric.active{background:var(--teal-soft);color:var(--teal)}
#rail .ric.ghost{opacity:.38;cursor:default}
#rail .tz{margin-top:auto;font-size:11px;color:var(--gray);font-weight:500}
#rail .tip{position:absolute;left:52px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;display:none;z-index:50}
#rail .ric:hover .tip{display:block}
/* main */
#maincol{flex:1;display:flex;flex-direction:column;min-width:0}
#lanehead{padding:18px 26px 0}
#lanehead .top{display:flex;align-items:center;gap:14px}
#lanehead h1{font-size:26px;font-weight:500}
#lanehead .sub{color:var(--gray);font-size:12.5px;margin-top:4px}
.abtn{border:1px solid #CBD5E1;background:#fff;border-radius:7px;font-size:13px;font-weight:500;padding:7px 13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.abtn:hover{background:#F8FAFC}
.abtn.primary{background:var(--teal);border-color:var(--teal);color:#F7F7F8}
.abtn.primary:hover{background:#16403E}
.abtn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;align-items:center;gap:8px;padding:14px 26px 4px;flex-wrap:wrap}
.chip{border:1px solid #CBD5E1;border-radius:16px;padding:4px 13px;font-size:12.5px;cursor:pointer;background:#fff;color:#334155}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.gtoggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#334155;margin-left:auto;cursor:pointer;user-select:none;white-space:nowrap}
.gtoggle input{accent-color:var(--teal)}
#listwrap{flex:1;overflow:auto;padding:10px 26px 90px}
.listcard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* Load type column temporarily removed (was 1.15fr before the trailing chev track in both rules below) — restore by adding it back in .colhead/.lanerow and .colhead.grouped/.lanerow.grouped */
.colhead{display:grid;grid-template-columns:1.1fr .7fr 1fr 1.8fr 1.3fr .9fr 20px;gap:18px;padding:10px 16px;font-size:11px;letter-spacing:.4px;color:var(--gray);font-weight:500;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0}
.colhead.grouped,.lanerow.grouped{grid-template-columns:1.1fr .7fr 1.8fr 1.3fr .9fr 20px}
.grouphead{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:13px;font-weight:500;color:#334155;background:#FAFBFB;border-bottom:1px solid var(--line);border-top:1px solid var(--line);cursor:pointer}
.grouphead .chev{transition:transform .15s;color:var(--gray);display:inline-block}
.grouphead.collapsed .chev{transform:rotate(-90deg)}
.grouphead .n{color:var(--gray);font-weight:400}
.lanerow{display:grid;grid-template-columns:1.1fr .7fr 1fr 1.8fr 1.3fr .9fr 20px;gap:18px;align-items:center;padding:12px 16px;border-bottom:1px solid #F1F5F9;cursor:pointer;font-size:13.5px}
.lanerow:hover{background:#F8FAFC}
.lanerow .code{font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flagexp{background:var(--warnbg);color:#92400E;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:10px;white-space:nowrap;flex:none}
.lanerow .cust{color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanerow .od{color:#334155;overflow:hidden}
.lanerow .od .odcell{display:flex;align-items:center;gap:5px;min-width:0}
.lanerow .od .odfirst{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lanerow .od .odmore{flex:none;color:var(--gray);font-size:11px;font-weight:500;white-space:nowrap;text-decoration:underline;cursor:default}
.lanerow .win{color:var(--gray);font-size:12.5px;white-space:nowrap}
.lanerow .pd{color:var(--gray);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanerow .lt{color:var(--gray);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanerow .chev2{color:#CBD5E1}
.pill{border-radius:12px;padding:3px 11px;font-size:12px;font-weight:500;display:inline-block}
.p-scheduled{background:var(--bluesoft);color:var(--blue)}
.p-active{background:var(--greensoft);color:#166534}
.p-expired{background:var(--warnbg);color:#92400E}
.p-cancelled{background:#E5E7EB;color:#374151}
.lid{background:#F1F5F9;border-radius:6px;padding:3px 9px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
/* drawer */
#drawer{width:0;flex:none;background:#fff;border-left:1px solid var(--line);overflow:hidden;transition:width .18s ease;display:flex;flex-direction:column}
#drawer.open{width:560px}
#dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:none}
#dhead .top{display:flex;align-items:center;gap:8px}
#dhead .x{margin-left:auto;cursor:pointer;color:var(--gray);font-size:16px;padding:2px 8px;border-radius:6px}
#dhead .x:hover{background:#F1F5F9}
#dhead h2{font-size:17px;font-weight:500;margin-top:6px}
#dhead .meta{color:var(--gray);font-size:12.5px;margin-top:3px}
#dhead .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#dtl{flex:1;overflow-y:auto;padding:14px 18px 24px}
#dtl .sect{font-size:11px;letter-spacing:1px;color:var(--gray);font-weight:500;margin-bottom:10px;display:flex}
#dtl .sect span:last-child{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}
#dfoot{flex:none;border-top:1px solid var(--line);padding:12px 18px;display:none;gap:8px;justify-content:flex-end;background:#fff}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:6px}
.dr{display:flex;flex-direction:column;gap:2px;font-size:13px}
.dr .k{font-size:11px;color:var(--gray);letter-spacing:.3px}
.dr .v{color:var(--ink)}
.odview{padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13.5px;background:#FBFDFC}
.odview i{color:#94A3B8;font-style:normal;font-size:12px}
.provbanner{background:#F1F5F9;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#334155;margin-bottom:14px;line-height:1.5}
.provlink{color:var(--teal);cursor:pointer;font-weight:500}
.provlink:hover{text-decoration:underline}
.mrow{display:grid;grid-template-columns:64px 96px 84px 1fr 64px 64px;gap:8px;padding:7px 0;border-bottom:1px solid #F1F5F9;font-size:12.5px;align-items:center}
.mrow.head{color:var(--gray);font-size:10.5px;letter-spacing:.4px;font-weight:500;border-bottom:1px solid var(--line)}
.mrow .note{grid-column:1/-1;color:var(--orange);font-size:11.5px;padding:2px 0 4px}
.mrow .late{color:var(--red);font-weight:500}
.mweekhead{padding:10px 0 4px;font-size:11.5px;font-weight:500;color:#334155}
.mweekhead .n{color:var(--gray);font-weight:400;margin-left:6px}
/* form */
.formsect{margin-bottom:16px}
.formsect>.lbl{font-size:11px;letter-spacing:1px;color:var(--gray);font-weight:500;margin-bottom:8px;display:block}
.frow{display:flex;gap:10px;margin-bottom:14px}
.ffield{flex:1;display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.frow .ffield{margin-bottom:0}
.ffield label{font-size:12px;color:#475569;font-weight:500}
.ffield input[type=text],.ffield input[type=date],.ffield select,.ffield textarea{border:1px solid #CBD5E1;border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;width:100%}
.ffield input:focus,.ffield select:focus{border-color:var(--teal)}
.ffield input:disabled{background:#F1F5F9;color:var(--gray);cursor:not-allowed}
.ffield .err{color:var(--red);font-size:11.5px;min-height:14px}
.ffield .hint{font-size:11px;color:#94A3B8}
.checkrow{display:flex;align-items:center;gap:6px;font-size:13px;color:#334155}
.odrow{border:1px solid var(--line);border-radius:9px;padding:10px 12px 4px;margin-bottom:8px;position:relative;background:#FBFDFC}
.odrow .odgrid{display:flex;align-items:center;gap:8px}
.odrow .arrow{color:var(--gray);margin-top:16px}
.odrow .rm{position:absolute;top:8px;right:8px;color:var(--gray);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:5px}
.odrow .rm:hover{background:#F1F5F9;color:var(--red)}
.odrow .hint{font-size:11px;color:#94A3B8;margin-top:4px}
.addod{border:1px dashed #CBD5E1;border-radius:8px;padding:8px;text-align:center;font-size:12.5px;color:var(--teal);cursor:pointer;background:#fff}
.addod:hover{background:#F4FAF7}
.conflictbanner{background:var(--warnbg);border:1px solid #E8C34A;border-radius:9px;padding:12px 14px;margin-bottom:16px}
.conflictbanner .t{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px}
.conflictbanner .d{font-size:12.5px;color:#7C5A00;margin-top:5px;line-height:1.5}
.conflictbanner .btns{margin-top:9px}
/* modal + toast */
#ovl{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:100}
#ovl.show{display:flex}
.modal{background:#fff;border-radius:12px;width:440px;max-width:92vw;max-height:86vh;overflow-y:auto}
.modal .mh{display:flex;padding:16px 20px 4px;align-items:center}
.modal .mh b{font-size:16px}
.modal .mh .x{margin-left:auto;cursor:pointer;color:var(--gray)}
.modal .mb{padding:10px 20px 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;border-radius:8px;padding:9px 16px;font-size:13.5px;z-index:300;max-width:80vw;text-align:center}
</style>
</head>

/* ---------- helpers ---------- */
function fmtDate(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDateShort(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function windowText(l){return (fmtDate(l.plannedStart)||'—')+' – '+(fmtDate(l.plannedEnd)||'—');}
function mondayOf(iso){const d=new Date(iso+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function weekLabel(mondayIso){return fmtDateShort(mondayIso)+' – '+fmtDateShort(addDays(mondayIso,6));}
function last4WeeksStart(){return addDays(mondayOf(TODAY),-21);}
function recentMatched(matched){const windowStart=last4WeeksStart();return matched.filter(m=>m.date&&m.date>=windowStart&&m.date<=TODAY);}
function groupMatchedByWeek(matched){
 const recent=recentMatched(matched);
 const groups={};
 recent.forEach(m=>{const wk=mondayOf(m.date);(groups[wk]=groups[wk]||[]).push(m);});
 Object.values(groups).forEach(g=>g.sort((a,b)=>a.date.localeCompare(b.date)));
 const weeks=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
 return{recent,weeks,groups};
}
function odLabel(pair){const o=pair.origin||'any origin';const d=pair.destination||'any destination';return o+' → '+d;}
function odSummary(l){
 if(!l.od.length)return '—';
 return '<span class="odcell" data-lane="'+esc(l.id)+'"><span class="odfirst"></span><span class="odmore"></span></span>';
}
function layoutOdCells(){
 document.querySelectorAll('.odcell[data-lane]').forEach(cell=>{
  const l=LANES[cell.dataset.lane];
  if(!l)return;
  const first=cell.querySelector('.odfirst');
  const more=cell.querySelector('.odmore');
  const labels=l.od.map(odLabel);
  const render=n=>{
   first.textContent=labels.slice(0,n).join('  ·  ');
   const remaining=labels.length-n;
   more.textContent=remaining>0?'+'+remaining+' more':'';
   more.style.display=remaining>0?'inline':'none';
   cell.title=remaining>0?labels.join('\n'):'';
  };
  let shown=labels.length;
  render(shown);
  while(shown>1&&first.scrollWidth>first.clientWidth){shown--;render(shown);}
 });
}
function locMatch(a,b){return !a||!b||a.toLowerCase()===b.toLowerCase();}
function odOverlap(a,b){return locMatch(a.origin,b.origin)&&locMatch(a.destination,b.destination);}
function dateOverlap(s1,e1,s2,e2){const E1=e1||'9999-12-31',E2=e2||'9999-12-31';return s1<=E2&&s2<=E1;}
function findConflict(customer,od,start,end,excludeIds){excludeIds=excludeIds||[];
 for(const id in LANES){const L=LANES[id];
  if(excludeIds.includes(id))continue;
  if(L.customer!==customer)continue;
  const st=deriveStatus(L);
  if(st==='Cancelled'||st==='Expired')continue;
  if(!dateOverlap(start,end,L.plannedStart,L.plannedEnd))continue;
  for(const p of od)for(const lp of L.od)if(odOverlap(p,lp))return{lane:L,pair:p,lp:lp};
 }
 return null;}
function idFromCode(code){let base=(code||'LANE').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'LANE';let id=base,n=1;while(LANES[id]){n++;id=base+'-'+n;}return id;}
function autoCode(customer){return (customer||'LANE').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()+'-'+Math.floor(Math.random()*900+100);}
function prevDay(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function suggestRenewCode(code){const m=code.match(/-V(\d+)$/i);if(m)return code.replace(/-V\d+$/i,'')+'-V'+(+m[1]+1);
 const m2=code.match(/(\d+)$/);if(m2){const n=(+m2[1]+1);return code.slice(0,-m2[1].length)+String(n).padStart(m2[1].length,'0');}
 return code+'-V2';}
function deriveStatus(l){
 if(l.actualEnd)return 'Cancelled';
 if(!l.actualStart)return 'Scheduled';
 if(l.plannedEnd&&TODAY>l.plannedEnd)return 'Expired';
 return 'Active';
}
function isExpiringSoon(l){if(deriveStatus(l)!=='Active'||!l.plannedEnd||l.renewedTo)return false;const days=(new Date(l.plannedEnd)-new Date(TODAY))/86400000;return days>=0&&days<=21;}

 return{all:vals.length,scheduled:vals.filter(l=>deriveStatus(l)==='Scheduled').length,active:vals.filter(l=>deriveStatus(l)==='Active').length,expired:vals.filter(l=>deriveStatus(l)==='Expired').length,cancelled:vals.filter(l=>deriveStatus(l)==='Cancelled').length,exp:vals.filter(isExpiringSoon).length};}

function passFilter(l){if(CHIPFILTER==='all')return true;if(CHIPFILTER==='exp')return isExpiringSoon(l);return deriveStatus(l)===CHIPFILTER[0].toUpperCase()+CHIPFILTER.slice(1);}
function statusPill(l){const st=deriveStatus(l);const cls='p-'+st.toLowerCase();return '<span class="pill '+cls+'">'+st+'</span>';}
function pickupDropLabel(l){if(l.dropPickup&&l.dropDelivery)return 'Pick-up & Delivery';if(l.dropPickup)return 'Pick-up';if(l.dropDelivery)return 'Delivery';return '—';}

function colHead(showCust){return '<div class="colhead'+(showCust?'':' grouped')+'"><div>Lane</div><div>Status</div>'+(showCust?'<div>Customer</div>':'')+'<div>OD pair(s)</div><div>Planned window</div>'+/* '<div>Load type</div>'+ */'<div>Pick-up/Delivery</div><div></div></div>';}
function toggleGroup(c){COLLAPSED[c]=!COLLAPSED[c];renderList();}
function updateSub(){const c=chipCounts();$('lanesub').textContent=c.all+' lanes · '+c.active+' active · '+c.exp+' expiring soon';}
function renderList(){renderChips();updateSub();

 if(!ids.length){wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray);font-size:13.5px">No lanes match this filter.</div>';return;}
 if(GROUPBY){
  const byCust={};ids.forEach(id=>{const c=LANES[id].customer;(byCust[c]=byCust[c]||[]).push(id);});
  const custs=Object.keys(byCust).sort();
  wrap.innerHTML='<div class="listcard">'+colHead(false)+custs.map(c=>{
   const collapsed=!!COLLAPSED[c];
   return '<div class="grouphead'+(collapsed?' collapsed':'')+'" onclick="toggleGroup(\''+esc(c).replace(/'/g,"\\'")+'\')"><span class="chev">▾</span>'+esc(c)+' <span class="n">· '+byCust[c].length+' lane'+(byCust[c].length>1?'s':'')+'</span></div>'+
   (collapsed?'':byCust[c].map(id=>rowHTML(id,false)).join(''));
  }).join('')+'</div>';
 } else {
  wrap.innerHTML='<div class="listcard">'+colHead(true)+ids.map(id=>rowHTML(id,true)).join('')+'</div>';
 }
 layoutOdCells();
}

 }

 const bcoUnknown=$('in_bcounknown').checked;

 const odRaw=odEls.map(el=>({origin:el.querySelector('[data-role=origin]').value.trim(),destination:el.querySelector('[data-role=destination]').value.trim(),_el:el}));

 let ok=true;
 if(!customer){showErr('e_customer','Pick a customer.');ok=false;}
 if(!start){showErr('e_start','Planned start is required.');ok=false;}
 if(!end){showErr('e_end','Planned end is required.');ok=false;}
 if(start&&end&&end<start){showErr('e_end','End date can’t be before the start date.');ok=false;}
 odRaw.forEach(p=>{const errEl=p._el.querySelector('.err');if(!p.origin&&!p.destination){errEl.textContent='Needs an origin or a destination — can’t wildcard both.';ok=false;}else errEl.textContent='';});
 if(!ok)return;

 const cleanOd=odRaw.map(p=>({origin:p.origin||null,destination:p.destination||null}));
 const excludeIds=(mode==='edit'||mode==='renew')?[id]:[];
 const conflict=findConflict(customer,cleanOd,start,end,excludeIds);
 if(conflict){
  $('conflictzone').innerHTML='<div class="conflictbanner"><div class="t">⚠️ Conflicts with an existing lane</div>'+
   '<div class="d"><b>'+esc(conflict.lane.code)+'</b> ('+esc(conflict.lane.customer)+') already covers <b>'+esc(odLabel(conflict.lp))+'</b> for '+windowText(conflict.lane)+'. Two active lanes can’t claim the same load — adjust the dates/OD or view the existing lane.</div>'+
   '<div class="btns"><button class="abtn" onclick="openLaneDrawer(\''+conflict.lane.id+'\')">View '+esc(conflict.lane.code)+'</button></div></div>';
  $('conflictzone').scrollIntoView({behavior:'smooth',block:'start'});
  return;
 }

 const code=codeInput||autoCode(customer);
 if(mode==='create'){
  const newId=idFromCode(code);
  LANES[newId]={id:newId,customer,name:name||null,bco,bcoUnknown,code,version:1,
   plannedStart:start,plannedEnd:end,actualStart:(start>TODAY?null:start),actualEnd:null,
   loadType:null,dropPickup,dropDelivery,renewedFrom:null,renewedTo:null,od:cleanOd,matched:[]};
  renderList();openLaneDrawer(newId);
  toast('Lane created — Apollo will begin auto-matching loads within this window.');
 } else if(mode==='edit'){
  Object.assign(LANES[id],{customer,name:name||null,bco,bcoUnknown,code,plannedStart:start,plannedEnd:end,dropPickup,dropDelivery,od:cleanOd});
  renderList();renderDrawerView(id);
  toast('Saved — no new lane version created.');
 } else if(mode==='renew'){
  const old=LANES[id];
  const closeDate=prevDay(start)||TODAY;
  old.actualEnd=closeDate;
  const newId=idFromCode(code);
  old.renewedTo=newId;
  LANES[newId]={id:newId,customer,name:name||null,bco,bcoUnknown,code,version:old.version+1,
   plannedStart:start,plannedEnd:end,actualStart:(start>TODAY?null:start),actualEnd:null,
   loadType:old.loadType,dropPickup,dropDelivery,renewedFrom:id,renewedTo:null,od:cleanOd,matched:[]};
  renderList();openLaneDrawer(newId);
  toast(esc(old.code)+' cancelled · renewed as '+esc(code)+' (v'+LANES[newId].version+') — history preserved.');
 }
}

/* ---------- cancel lane modal ---------- */
function openCancelModal(id){const l=LANES[id];
 $('modalbox').innerHTML='<div class="mh"><b>Cancel lane '+esc(l.code)+'</b><span class="x" onclick="closeModal()">✕</span></div>'+
 '<div class="mb"><div style="font-size:13px;color:#475569;margin-bottom:12px">New loads after this date won’t auto-match to '+esc(l.code)+'. Everything already logged stays intact.</div>'+
 '<div class="ffield"><label>Actual end date</label><input type="date" id="in_canceldate" value="'+TODAY+'"></div>'+
 '<div class="ffield"><label>Reason for cancellation</label><textarea id="in_cancelreason" rows="3" placeholder="e.g. Customer paused shipments, lane consolidated into another lane, rate renegotiation fell through"></textarea><div class="hint">Optional — shown on the lane\'s detail view</div></div>'+
 '<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="abtn" onclick="closeModal()">Back</button><button class="abtn primary" style="background:var(--red);border-color:var(--red)" onclick="confirmCancel(\''+id+'\')">Cancel lane</button></div></div>';
 $('ovl').classList.add('show');}
function confirmCancel(id){const d=$('in_canceldate').value||TODAY;const r=$('in_cancelreason').value.trim();
 LANES[id].actualEnd=d;LANES[id].cancelReason=r||null;closeModal();renderList();
 if(SELECTED===id)renderDrawerView(id);
 toast(esc(LANES[id].code)+' cancelled — stops matching new loads after '+fmtDate(d)+'.');}
function closeModal(){$('ovl').classList.remove('show');}

/* ---------- boot ---------- */
seedLanes();
$('groupToggle').addEventListener('change',e=>{GROUPBY=e.target.checked;renderList();});
renderList();
</script>
</body>
</html>
